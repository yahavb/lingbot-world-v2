apiVersion: v1
kind: Service
metadata:
  name: lbw-v2-gradio
spec:
  type: NodePort
  selector:
    app: lbw-v2-gradio
  ports:
    - port: 7860
      targetPort: 7860
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lbw-v2-gradio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lbw-v2-gradio
  template:
    metadata:
      labels:
        app: lbw-v2-gradio
    spec:
      nodeSelector:
        node-type: m5
      containers:
        - name: app
          image: public.ecr.aws/docker/library/python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DEBIAN_FRONTEND=noninteractive apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git >/dev/null
              git clone -b "$BRANCH" https://github.com/yahavb/lingbot-world-v2.git /app
              pip install -q --root-user-action=ignore --disable-pip-version-check gradio requests numpy pillow imageio imageio-ffmpeg
              exec python -u /app/gradio_app.py
          env:
            - name: BRANCH
              value: "main"
            - name: LBW_URL
              value: "http://lbw-v2-dit-t5.default.svc.cluster.local:8000"
          ports:
            - containerPort: 7860
          startupProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
