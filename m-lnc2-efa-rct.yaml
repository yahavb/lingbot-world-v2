# 2 Neuron devices at LNC2 from one 4-device group, each with its paired EFA (devicegroup1_id: a Neuron device's
# value is its paired EFA's PCI address). Two device+EFA pairs, both pairs in the same devicegroup4_id.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: m-lnc2-efa
  namespace: default
spec:
  metadata: {}
  spec:
    devices:
      config:
      - opaque:
          driver: neuron.aws.com
          parameters: {apiVersion: neuron.aws.com/v1, kind: NeuronConfig, logicalNeuronCore: 2}
        requests: [neurons-a, neurons-b]
      constraints:
      - matchAttribute: resource.aws.com/devicegroup1_id
        requests: [neurons-a, efas-a]
      - matchAttribute: resource.aws.com/devicegroup1_id
        requests: [neurons-b, efas-b]
      - matchAttribute: resource.aws.com/devicegroup4_id
        requests: [neurons-a, neurons-b, efas-a, efas-b]
      requests:
      - name: neurons-a
        exactly:
          allocationMode: ExactCount
          count: 1
          deviceClassName: neuron.aws.com
          selectors:
          - cel:
              expression: device.attributes['neuron.aws.com'].instanceType in ['trn2.48xlarge','trn3-dev1.48xlarge']
      - name: neurons-b
        exactly:
          allocationMode: ExactCount
          count: 1
          deviceClassName: neuron.aws.com
          selectors:
          - cel:
              expression: device.attributes['neuron.aws.com'].instanceType in ['trn2.48xlarge','trn3-dev1.48xlarge']
      - name: efas-a
        exactly: {allocationMode: ExactCount, count: 1, deviceClassName: efa.networking.k8s.aws}
      - name: efas-b
        exactly: {allocationMode: ExactCount, count: 1, deviceClassName: efa.networking.k8s.aws}
