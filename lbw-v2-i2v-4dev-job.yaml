# 4 trn3 devices (l-lnc2, 16 ranks, TP4 x CP4), the kiro/e2e/LEDGER.md best: 6.40 s per 81-frame 480x768 video,
# e2e MFU 33.9%. FILM_ALL is only correct at CP4 with <= 3 chunks per call (FILM_ALL_CHUNKS=3).
apiVersion: batch/v1
kind: Job
metadata:
  name: lbw-v2-i2v-4dev
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 100800
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neuroncores
          resourceClaimTemplateName: l-lnc2
      containers:
        - name: inference
          image: public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04
          command:
            - /bin/bash
            - "-c"
            - |
              [ -f /opt/neuron-top-patch/neuron-monitor-top.py ] && install -m 755 /opt/neuron-top-patch/neuron-monitor-top.py "$(command -v neuron-monitor-top.py || echo /opt/aws/neuron/bin/neuron-monitor-top.py)" 2>/dev/null && echo "neuron-top: patched (preview)" || true   # neuron-top-patch: temporary, remove when the updated neuron-top ships in the Neuron SDK
              set -euo pipefail
              git clone -b "$BRANCH" https://github.com/yahavb/lingbot-world-v2.git /tmp/lingbot
              cd /tmp/lingbot
              OUT=/tmp/results; mkdir -p "$OUT"
              trap 'echo "kubectl cp $(hostname):$OUT ./results"; sleep "$KEEP_ALIVE_SECONDS"' EXIT
              CKPT=/tmp/ckpt/lingbot-world-v2-14b-causal-fast
              SAVE="$OUT/lingbot_i2v_cp${CP}xtp${TP}_${SIZE//\*/x}_${FRAME_NUM}f.mp4"
              LATENTS=/tmp/latents.pt
              export NEURON_COMPILE_CACHE_URL=/var/tmp/neuron-compile-cache
              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              export NKI_ENABLE_TRACE_CACHE=1
              export TORCH_NEURONX_HLO_CACHE_DIR=/var/tmp/hlo_cache
              export HF_HOME=/tmp/hf-cache

              pip install -q -r requirements_neuron.txt
              python3 -c "import torchvision" 2>/dev/null || bash install_neuron.sh

              hf download robbyant/lingbot-world-v2-14b-causal-fast --local-dir "$CKPT"
              [ -f "$CKPT/transformers/config.json" ] || cp "$CKPT/config.json" "$CKPT/transformers/config.json"
              python3 scripts/inference/convert_dit_to_pth.py --ckpt_dir "$CKPT"
              rm -f "$CKPT"/transformers/*.safetensors

              python3 scripts/analysis/qk_gamma_temperature.py --ckpt_dir "$CKPT" | tee /tmp/qk.txt
              export FLASH_ATTN_LAYERS=$(grep -oE "CANDIDATE HOT LAYERS \([0-9]+\): [0-9,]+" /tmp/qk.txt | sed -E "s/.*: //" || true)

              ARGS=(--task i2v-A14B --infer_mode causal_fast --ckpt_dir "$CKPT"
                    --size "$SIZE" --frame_num "$FRAME_NUM" --chunk_size "$CHUNK_SIZE"
                    --image examples/03/image.jpg --action_path examples/03 --prompt "$PROMPT"
                    --tp_degree "$TP" --cp_size "$CP" --denoise_steps "$DENOISE_STEPS"
                    --local_attn_size "$LOCAL_ATTN_SIZE" --sink_size "$SINK_SIZE" --base_seed 42)
              NEURON_LOGICAL_NC_CONFIG="$LNC" torchrun --nproc_per_node="$NPROC" generate.py \
                "${ARGS[@]}" --save_file "$SAVE" --save_latents_path "$LATENTS" 2>&1 | tee "$OUT/generate.txt"
              NEURON_LOGICAL_NC_CONFIG="$LNC" torchrun --nproc_per_node="$NPROC" decode_latents_width_sharded.py \
                --task i2v-A14B --ckpt_dir "$CKPT" --latents_path "$LATENTS" --save_file "$SAVE" \
                --timing --warmup 2>&1 | tee "$OUT/decode.txt"

              GEN=$(grep -oE "\[BENCH\] GEN time: [0-9.]+" "$OUT/generate.txt" | grep -oE "[0-9.]+$")
              VAE=$(grep -oE "vae\.decode steady-state \([^)]*\): [0-9.]+" "$OUT/decode.txt" | grep -oE "[0-9.]+$")
              STEADY=$(python3 -c "print($FRAME_NUM / (($GEN + $VAE) / 1000))")

              python3 tests/smoke_test_video.py --skip-run --save-file "$SAVE" \
                --expected-frame-num "$FRAME_NUM" --size "$SIZE" --steady-fps "$STEADY"
          resources:
            claims:
              - name: neuroncores
            requests:
              ephemeral-storage: 600Gi
            limits:
              ephemeral-storage: 600Gi
          volumeMounts:
            - {name: neuron-top-patch, mountPath: /opt/neuron-top-patch, readOnly: true}   # neuron-top-patch
            - name: dshm
              mountPath: /dev/shm
          env:
            - name: LINGBOT_VAE_GATHER1
              value: "1"
            - name: LINGBOT_FILM_ALL_CHUNKS
              value: "3"
            - name: LINGBOT_FILM_ALL_BLOCKS
              value: "10"
            - name: LINGBOT_FILM_ALL
              value: "1"
            - name: LINGBOT_BLOCK_GROUP
              value: "2"
            - name: LINGBOT_CTE_SCALAR_ROWMAX
              value: "1"
            - name: LINGBOT_CTE_PRIOR_FULL
              value: "1"
            - name: LINGBOT_CTE_EXP_SPLIT
              value: "2"
            - name: LINGBOT_T5_FP32
              value: "1"
            - name: LINGBOT_VAE_2D
              value: "1"
            - name: LINGBOT_VAE_T
              value: "6"
            - name: LINGBOT_VAE_NORM
              value: "mm"
            - name: LINGBOT_VAE_CC_FLAGS
              value: "-O1"
            - name: LINGBOT_VAE_BF16
              value: "1"
            - name: LINGBOT_VAE_FUSED
              value: "1"
            - name: LINGBOT_STEP_NOWRITE
              value: "1"
            - name: LINGBOT_K_BLOCKED
              value: "1"
            - name: NKI_ENABLE_TRACE_CACHE
              value: "0"
            - name: LINGBOT_CTE_VGROUP
              value: "8"
            - name: LINGBOT_CTE_LOCAL
              value: "1"
            - name: LINGBOT_IMG_BLOCK
              value: "1"
            - name: LINGBOT_KEY_THREADS
              value: "4"
            - name: LINGBOT_COMMIT_NOHEAD
              value: "1"
            - name: LINGBOT_EMPTY_CACHE_SEQ
              value: "1000000000"
            - name: LINGBOT_PREUPLOAD
              value: "1"
            - name: LINGBOT_CROSS_NMAJOR
              value: "1"
            - name: LINGBOT_HEAD_COMPILE
              value: "1"
            - name: LINGBOT_FILM_BATCH
              value: "1"
            - name: LINGBOT_PLUCKER_COMPILE
              value: "1"
            - name: LINGBOT_ATTN_PAIR
              value: "1"
            - name: LINGBOT_ATTN_EARLY
              value: "2"
            - name: LINGBOT_TOKEN_PAD
              value: "32"
            - name: LINGBOT_NO_SYNC
              value: "1"
            - name: LINGBOT_SKIP_LAST_COMMIT
              value: "1"
            - name: LINGBOT_LOAD_CONCURRENCY
              value: "16"
            - name: NEURON_LAUNCH_BLOCKING
              value: "0"
            - name: LINGBOT_FILM_A2A
              value: "1"
            - name: LINGBOT_CTE_MERGE
              value: "1"
            - name: LINGBOT_SP
              value: "1"
            - name: LINGBOT_HOT_ATTN
              value: "cte"
            - name: BRANCH
              value: "e2e-4dev"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: KEEP_ALIVE_SECONDS
              value: "86400"
            - name: NPROC
              value: "16"
            - name: LNC
              value: "2"
            - name: CP
              value: "4"
            - name: TP
              value: "4"
            - name: SIZE
              value: "480*768"
            - name: FRAME_NUM
              value: "81"
            - name: CHUNK_SIZE
              value: "3"
            - name: LOCAL_ATTN_SIZE
              value: "12"
            - name: SINK_SIZE
              value: "1"
            - name: DENOISE_STEPS
              value: "4"
            - name: PROMPT
              value: "gentle ripples spreading across the calm lake water, tree leaves swaying softly in the breeze, clouds drifting slowly across the blue sky, cinematic slow camera push-in, serene natural motion"
            - name: LINGBOT_BENCH_RUNS
              value: "2"
            - name: LINGBOT_CHUNKED_KV
              value: "1"
            - name: LINGBOT_COMPILE_DIT
              value: "1"
            - name: COMPILE_SCOPE
              value: "blocks"
            - name: LINGBOT_CP_FLAT_SEQ
              value: "1"
            - name: ATTENTION_BACKEND
              value: "cte"
            - name: NEURON_CC_FLAGS
              value: "--internal-backend-options=--disable-cb-before-global-cc"
            - name: NKI_COMPILER_FRONTEND
              value: "tracer"
            - name: NEURON_FALLBACK_ENABLED
              value: "1"
            - name: TORCH_NEURONX_DISABLE_FALLBACK_EXECUTION
              value: "1"
            - name: NEURON_RT_EXEC_TIMEOUT
              value: "600"
            - name: NEURON_RT_ASYNC_EXEC_MAX_INFLIGHT_REQUESTS
              value: "0"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            - name: NEURON_LOAD_CONCURRENCY
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true
      volumes:
        - name: neuron-top-patch   # neuron-top-patch: temporary, remove when the updated neuron-top ships in the Neuron SDK
          configMap: {name: neuron-top-patch, optional: true}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
