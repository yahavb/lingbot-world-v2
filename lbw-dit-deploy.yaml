# lbw-dit: DiT + T5 (serve.py) on 4 trn3 devices with paired EFAs (x-lnc2-efa-4, 16 ranks, TP4 x CP4, LNC2), the
# common flags of the disagg matrix (4 + 1 measured 17.5 fps, perf/disagg/results/p3_split_d4v1_480). VAE picked per
# session from the Ready app=lbw-vae pods (lbw-vae-deploy.yaml). Generated by perf/disagg/mk.py; neuron-observer
# health-check initContainer as wan2 / earlier lbw deploys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lbw-dit
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lbw-dit
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: lbw-dit
    spec:
      containers:
      - command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          git clone -b "$BRANCH" https://github.com/yahavb/lingbot-world-v2.git /tmp/lingbot
          cd /tmp/lingbot
          echo "commit: $(git log --oneline -1)"
          # enhanced neuron-top (op names in the memory layout, EFA traffic), from the repo
          install -m 755 tools/neuron-top/neuron-monitor-top.py "$(command -v neuron-monitor-top.py || echo /opt/aws/neuron/bin/neuron-monitor-top.py)" \
            && echo "neuron-top: enhanced" || echo "neuron-top: stock"
          # NIXL (latents DiT -> VAE over EFA, LINGBOT_VAE_TRANSPORT=nixl): built once per node into the node cache
          eval "$(bash tools/nixl/build_nixl.sh)" && echo "nixl: $NIXL_PLUGIN_DIR"
          NODE=/node-cache; mkdir -p "$NODE"
          CKPT=$NODE/lingbot-world-v2-14b-causal-fast
          # CACHE_VERSION namespaces every compile cache on the node: bump it (env below) when pulling new
          # model/kernel code, so no pod picks up graphs compiled from the previous version
          C=$NODE/cache/v${CACHE_VERSION:?set CACHE_VERSION}
          export NEURON_COMPILE_CACHE_URL=$C/neuron-compile-cache
          # compiled graphs persist on the node: the first pod on a node fills these, every later pod
          # (restart, rollout, a second replica) reuses whatever is already there
          export TORCH_NEURONX_NEFF_CACHE_DIR=$C/neff_cache
          export NKI_ENABLE_TRACE_CACHE="${NKI_ENABLE_TRACE_CACHE:-1}"
          export TORCH_NEURONX_HLO_CACHE_DIR=$C/hlo_cache
          mkdir -p "$NEURON_COMPILE_CACHE_URL" "$TORCH_NEURONX_NEFF_CACHE_DIR" "$TORCH_NEURONX_HLO_CACHE_DIR" "$C/nki-intermediate-cache"
          # compiled graphs reference NKI kernel binaries by path under /var/tmp: keep them with the cache
          rm -rf /var/tmp/nki-intermediate-cache && ln -s "$C/nki-intermediate-cache" /var/tmp/nki-intermediate-cache
          echo "neff cache on node (v$CACHE_VERSION): $(find "$TORCH_NEURONX_NEFF_CACHE_DIR" -name '*.neff' 2>/dev/null | wc -l) NEFFs"
          export HF_HOME=/tmp/hf-cache

          pip install -q -r requirements_neuron.txt huggingface_hub fastapi uvicorn kubernetes
          python3 -c "import torchvision" 2>/dev/null || bash install_neuron.sh

          # checkpoint: download + convert once per node (flock; .complete marks a finished entry)
          flock "$NODE/ckpt.lock" bash -c '
            [ -f "$1/.complete" ] && { echo "ckpt: on node cache"; exit 0; }
            hf download robbyant/lingbot-world-v2-14b-causal-fast --local-dir "$1"
            [ -f "$1/transformers/config.json" ] || cp "$1/config.json" "$1/transformers/config.json"
            python3 scripts/inference/convert_dit_to_pth.py --ckpt_dir "$1"
            rm -f "$1"/transformers/*.safetensors
            touch "$1/.complete"' _ "$CKPT"

          python3 scripts/analysis/qk_gamma_temperature.py --ckpt_dir "$CKPT" | tee /tmp/qk.txt
          export FLASH_ATTN_LAYERS=$(grep -oE "CANDIDATE HOT LAYERS \([0-9]+\): [0-9,]+" /tmp/qk.txt | sed -E "s/.*: //" || true)

          NEURON_LOGICAL_NC_CONFIG="$LNC" torchrun --nproc_per_node="$NPROC" serve.py \
            --task i2v-A14B --infer_mode causal_fast --ckpt_dir "$CKPT" \
            --size "$SIZE" --frame_num "$FRAME_NUM" --chunk_size "$CHUNK_SIZE" \
            --image examples/03/image.jpg --action_path examples/03 --prompt "$PROMPT" \
            --tp_degree "$TP" --cp_size "$CP" --denoise_steps "$DENOISE_STEPS" \
            --local_attn_size "$LOCAL_ATTN_SIZE" --sink_size "$SINK_SIZE" --base_seed 42 2>&1 \
            | tee -a /logs/serve.log | grep --line-buffered -avE "AliasingInfo|Mutated inputs|Detected collective"
        env:
        - name: CACHE_VERSION
          value: mono4
        - name: LINGBOT_REANCHOR_FRAMES
          value: "0"
        - name: BRANCH
          value: main
        - name: SEG_CHUNKS
          value: "14"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NPROC
          value: "16"
        - name: LNC
          value: "2"
        - name: CP
          value: "4"
        - name: TP
          value: "4"
        - name: SIZE
          value: 480*768
        - name: FRAME_NUM
          value: "81"
        - name: CHUNK_SIZE
          value: "3"
        - name: LOCAL_ATTN_SIZE
          value: "12"
        - name: SINK_SIZE
          value: "1"
        - name: DENOISE_STEPS
          value: "4"
        - name: PROMPT
          value: gentle ripples spreading across the calm lake water, tree leaves
            swaying softly in the breeze, clouds drifting slowly across the blue sky,
            cinematic slow camera push-in, serene natural motion
        - name: LINGBOT_BENCH_RUNS
          value: "1"
        - name: LINGBOT_CHUNKED_KV
          value: "1"
        - name: LINGBOT_COMPILE_DIT
          value: "1"
        - name: COMPILE_SCOPE
          value: blocks
        - name: LINGBOT_CP_FLAT_SEQ
          value: "1"
        - name: ATTENTION_BACKEND
          value: cte
        - name: LINGBOT_HOT_ATTN
          value: cte
        - name: LINGBOT_SP
          value: "1"
        - name: LINGBOT_CTE_MERGE
          value: "1"
        - name: LINGBOT_FILM_A2A
          value: "1"
        - name: NEURON_LAUNCH_BLOCKING
          value: "0"
        - name: LINGBOT_LOAD_CONCURRENCY
          value: "16"
        - name: LINGBOT_SKIP_LAST_COMMIT
          value: "1"
        - name: LINGBOT_NO_SYNC
          value: "1"
        - name: LINGBOT_TOKEN_PAD
          value: "32"
        - name: LINGBOT_ATTN_EARLY
          value: "2"
        - name: LINGBOT_ATTN_PAIR
          value: "1"
        - name: LINGBOT_PLUCKER_COMPILE
          value: "1"
        - name: LINGBOT_FILM_BATCH
          value: "1"
        - name: LINGBOT_HEAD_COMPILE
          value: "1"
        - name: LINGBOT_CROSS_NMAJOR
          value: "1"
        - name: LINGBOT_PREUPLOAD
          value: "1"
        - name: LINGBOT_EMPTY_CACHE_SEQ
          value: "1000000000"
        - name: LINGBOT_COMMIT_NOHEAD
          value: "1"
        - name: LINGBOT_FILM_ALL
          value: "0"
        - name: LINGBOT_KEY_THREADS
          value: "4"
        - name: LINGBOT_IMG_BLOCK
          value: "1"
        - name: LINGBOT_CTE_LOCAL
          value: "1"
        - name: LINGBOT_CTE_VGROUP
          value: "8"
        - name: NKI_ENABLE_TRACE_CACHE
          value: "0"
        - name: LINGBOT_K_BLOCKED
          value: "1"
        - name: LINGBOT_STEP_NOWRITE
          value: "1"
        - name: NEURON_CC_FLAGS
          value: --internal-backend-options=--disable-cb-before-global-cc
        - name: NKI_COMPILER_FRONTEND
          value: tracer
        - name: NEURON_FALLBACK_ENABLED
          value: "1"
        - name: TORCH_NEURONX_DISABLE_FALLBACK_EXECUTION
          value: "1"
        - name: NEURON_RT_EXEC_TIMEOUT
          value: "600"
        - name: NEURON_RT_ASYNC_EXEC_MAX_INFLIGHT_REQUESTS
          value: "0"
        - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
          value: "134217728"
        - name: NEURON_LOAD_CONCURRENCY
          value: "8"
        - name: NEURON_RT_LOG_LEVEL
          value: ERROR
        - name: NEURON_CC_LOG_LEVEL
          value: ERROR
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: HF_TOKEN
              name: hf-token
              optional: true
        - name: LINGBOT_FFN_MX
          value: "1"
        - name: LINGBOT_LIN_MX
          value: "1"
        - name: LINGBOT_LIN_MX_SKIP
          value: ""
        - name: LINGBOT_MX_TUNED
          value: "1"
        - name: LINGBOT_MX_FAST_DMA
          value: "1"
        - name: LINGBOT_CTE_CHAIN
          value: "1"
        - name: LINGBOT_V_TOKEN_MAJOR
          value: "1"
        - name: LINGBOT_CTE_QPAD
          value: "32"
        - name: LINGBOT_CROSS_DEDUP
          value: "128"
        - name: LINGBOT_POST_LEAN
          value: "1"
        - name: LINGBOT_KV_REUSE
          value: "1"
        - name: LINGBOT_START_OVERLAP
          value: "4"
        - name: LINGBOT_FILM_SHARD
          value: "1"
        - name: LINGBOT_SCHED_FUSE
          value: "1"
        - name: LINGBOT_GC_OFF
          value: "1"
        - name: LINGBOT_CTE_KV_DGE
          value: hwdge_sync
        - name: LINGBOT_TEMB_SLICE
          value: "1"
        - name: LINGBOT_SERVE_MEM_LOG
          value: "1"
        - name: LINGBOT_SERVE_EMPTY_CACHE
          value: "0"
        - name: LINGBOT_WT_PRE
          value: "1"
        - name: LINGBOT_ATTN_FMAJ
          value: "1"
        - name: LINGBOT_FFN_FMAJ
          value: "1"
        - name: LINGBOT_VAE_GATHER1
          value: "1"
        - name: LINGBOT_FILM_ALL_CHUNKS
          value: "3"
        - name: LINGBOT_FILM_ALL_BLOCKS
          value: "10"
        - name: LINGBOT_BLOCK_GROUP
          value: "2"
        - name: LINGBOT_CTE_SCALAR_ROWMAX
          value: "1"
        - name: LINGBOT_CTE_PRIOR_FULL
          value: "1"
        - name: LINGBOT_CTE_EXP_SPLIT
          value: "2"
        - name: LINGBOT_T5_FP32
          value: "1"
        - name: LINGBOT_VAE_2D
          value: "1"
        - name: LINGBOT_VAE_T
          value: "2"
        - name: LINGBOT_VAE_NORM
          value: mm
        - name: LINGBOT_VAE_CC_FLAGS
          value: -O1+--model-type=unet-inference
        - name: LINGBOT_VAE_BF16
          value: "1"
        - name: LINGBOT_VAE_FUSED
          value: "1"
        - name: LINGBOT_VAE_RDMA
          value: "1"
        - name: LINGBOT_VAE_PER_DEVICE
          value: "2"
        - name: LINGBOT_VAE_HEAD_BF16
          value: "1"
        - name: LINGBOT_VAE_NKI_HALO
          value: "1"
        - name: LINGBOT_VAE_NKI_CONV
          value: all
        - name: LINGBOT_VAE_NKI_CONV_SQ
          value: bf16
        - name: LINGBOT_VAE_NKI_CONV_LA
          value: "0"
        - name: LINGBOT_VAE_NKI_CONV_CMAX
          value: "192"
        - name: LINGBOT_VAE_NKI_UP
          value: all
        - name: LINGBOT_VAE_NKI_UP_FOLD
          value: "1"
        - name: LINGBOT_VAE_LOW_T
          value: "20"
        - name: FI_PROVIDER
          value: efa
        - name: FI_EFA_USE_DEVICE_RDMA
          value: "1"
        - name: FI_EFA_FORK_SAFE
          value: "1"
        - name: FI_EFA_ENABLE_SHM_TRANSFER
          value: "0"
        - name: CCOM_SOCKET_IFNAME
          value: eth0
        - name: VAE_URL
          value: http://lbw-vae.default.svc.cluster.local:8000
        - name: VAE_SELECTOR
          value: app=lbw-vae
        image: public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 60
          timeoutSeconds: 30
        name: inference
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8000
          periodSeconds: 10
        resources:
          claims:
          - name: neuroncores
          limits:
            cpu: "95"
            ephemeral-storage: 600Gi
            memory: 950Gi
          requests:
            cpu: "4"
            ephemeral-storage: 100Gi
            memory: 8Gi
        startupProbe:
          failureThreshold: 240
          httpGet:
            path: /readiness
            port: 8000
          periodSeconds: 30
        volumeMounts:
        - mountPath: /node-cache
          name: node-cache
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /logs
          name: logs
      initContainers:
      - args:
        - |
          ls /dev/neuron*
          neuron-observer health-check --test matmul
        command:
        - sh
        - -c
        env:
        - name: NEURON_RT_ALLOW_LEGACY_NEFF
          value: "1"
        image: public.ecr.aws/neuron/neuron-observer:0.2.0
        name: neuron-healthcheck
        resources:
          claims:
          - name: neuroncores
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
      - name: neuroncores
        resourceClaimTemplateName: x-lnc2-efa-4
      serviceAccountName: lbw-dit
      volumes:
      - hostPath:
          path: /opt/lingbot-world-v2
          type: DirectoryOrCreate
        name: node-cache
      - emptyDir: {}
        name: logs
      - emptyDir:
          medium: Memory
          sizeLimit: 64Gi
        name: dshm
