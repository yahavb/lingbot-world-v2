# One 81-frame 480x768 video on 4 trn3 devices at LNC2 (l-lnc2, 16 ranks, TP4 x CP4), MXFP8 on every block Linear.
# kiro_mx4 (loop_engineering_16_fps_minimal_setup): 16.53 fps measured (GEN 4270.9 ms + VAE 630 ms), 16.91 fps with the
# trn2 pipeline flags (GEN 4160.0 ms); see kiro_mx4/RESULTS.md. fps = 81 / (GEN + VAE): GEN = last of 3 warm passes,
# VAE = the faster of 2 decodes (the first decode process after GEN still compiles). The video is written to /tmp/results.
apiVersion: batch/v1
kind: Job
metadata:
  name: lbw-mx-lnc2-4chip
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neuroncores
          resourceClaimTemplateName: l-lnc2
      containers:
        - name: inference
          image: public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04
          command:
            - /bin/bash
            - "-c"
            - |
              set -euo pipefail
              git clone -b "$BRANCH" https://github.com/yahavb/lingbot-world-v2.git /tmp/lingbot
              cd /tmp/lingbot
              echo "commit: $(git log --oneline -1)"
              OUT=/tmp/results; mkdir -p "$OUT"
              trap 'echo "kubectl cp $(hostname):$OUT ./results"; sleep "${KEEP_ALIVE_SECONDS:-7200}"' EXIT
              CKPT=/node-cache/lingbot-world-v2-14b-causal-fast
              [ -f "$CKPT/.complete" ] || { echo "no ckpt on this node"; exit 1; }
              SAVE="$OUT/lbw_ffnmx${LINGBOT_FFN_MX}_cp${CP}xtp${TP}_${SIZE//\*/x}_${FRAME_NUM}f.mp4"
              LATENTS=$OUT/latents.pt
              export NEURON_COMPILE_CACHE_URL=/var/tmp/neuron-compile-cache
              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              export TORCH_NEURONX_HLO_CACHE_DIR=/var/tmp/hlo_cache
              export HF_HOME=/tmp/hf-cache
              pip install -q -r requirements_neuron.txt
              python3 -c "import torchvision" 2>/dev/null || bash install_neuron.sh

              python3 scripts/analysis/qk_gamma_temperature.py --ckpt_dir "$CKPT" | tee /tmp/qk.txt
              export FLASH_ATTN_LAYERS=$(grep -oE "CANDIDATE HOT LAYERS \([0-9]+\): [0-9,]+" /tmp/qk.txt | sed -E "s/.*: //" || true)

              ARGS=(--task i2v-A14B --infer_mode causal_fast --ckpt_dir "$CKPT"
                    --size "$SIZE" --frame_num "$FRAME_NUM" --chunk_size "$CHUNK_SIZE"
                    --image examples/03/image.jpg --action_path examples/03 --prompt "$PROMPT"
                    --tp_degree "$TP" --cp_size "$CP" --denoise_steps "$DENOISE_STEPS"
                    --local_attn_size "$LOCAL_ATTN_SIZE" --sink_size "$SINK_SIZE" --base_seed 42)
              NEURON_LOGICAL_NC_CONFIG="$LNC" torchrun --nproc_per_node="$NPROC" generate.py \
                "${ARGS[@]}" --save_file "$SAVE" --save_latents_path "$LATENTS" 2>&1 \
                | grep --line-buffered -avE "AliasingInfo|Mutated inputs|Detected collective" | tee "$OUT/generate.txt"
              for i in 1 2; do
                NEURON_LOGICAL_NC_CONFIG="$LNC" torchrun --nproc_per_node="$NPROC" decode_latents_width_sharded.py \
                  --task i2v-A14B --ckpt_dir "$CKPT" --latents_path "$LATENTS" --save_file "$SAVE" \
                  --timing --warmup 2>&1 | grep --line-buffered -avE "AliasingInfo|Mutated inputs" | tee "$OUT/decode$i.txt"
              done
              GEN=$(grep -oE "\[BENCH\] GEN time: [0-9.]+" "$OUT/generate.txt" | tail -1 | grep -oE "[0-9.]+$")
              VAE=$(cat "$OUT"/decode1.txt "$OUT"/decode2.txt | grep -oE "vae\.decode steady-state \([^)]*\): [0-9.]+" | grep -oE "[0-9.]+$" | sort -n | head -1)
              STEADY=$(python3 -c "print(round($FRAME_NUM / (($GEN + $VAE) / 1000), 2))")
              echo "[RESULT] FFN_MX=$LINGBOT_FFN_MX GEN_ms=$GEN VAE_ms=$VAE fps=$STEADY"
              python3 tests/smoke_test_video.py --skip-run --save-file "$SAVE" \
                --expected-frame-num "$FRAME_NUM" --size "$SIZE" --steady-fps "$STEADY" || true
          resources:
            claims:
              - name: neuroncores
            requests:
              cpu: "40"
              memory: 600Gi
              ephemeral-storage: 300Gi
            limits:
              memory: 900Gi
              ephemeral-storage: 300Gi
          volumeMounts:
            - name: node-cache
              mountPath: /node-cache
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          env:
            # kiro_mx4: the 16 fps flags on top of lbw-v2-lnc2-mx-deploy.yaml
            - name: LINGBOT_LIN_MX
              value: "1"
            - name: LINGBOT_LIN_MX_SKIP
              value: ""
            - name: LINGBOT_MX_TUNED
              value: "1"
            - name: LINGBOT_MX_FAST_DMA
              value: "1"
            - name: LINGBOT_CTE_KV_DGE
              value: "hwdge_sync"
            - name: LINGBOT_TEMB_SLICE
              value: "1"
            - name: LINGBOT_CTE_CHAIN
              value: "1"
            - name: LINGBOT_V_TOKEN_MAJOR
              value: "1"
            - name: LINGBOT_CTE_QPAD
              value: "32"
            - name: LINGBOT_CROSS_DEDUP
              value: "128"
            - name: LINGBOT_FFN_MX
              value: "1"
            - name: BRANCH
              value: "loop_engineering_16_fps_minimal_setup"
            - name: LINGBOT_WT_PRE
              value: "1"
            - name: LINGBOT_ATTN_FMAJ
              value: "1"
            - name: LINGBOT_FFN_FMAJ
              value: "1"
            - name: LINGBOT_VAE_GATHER1
              value: "1"
            - name: LINGBOT_FILM_ALL_CHUNKS
              value: "3"
            - name: LINGBOT_FILM_ALL_BLOCKS
              value: "10"
            - name: LINGBOT_FILM_ALL
              value: "0"
            - name: LINGBOT_BLOCK_GROUP
              value: "2"
            - name: LINGBOT_CTE_SCALAR_ROWMAX
              value: "1"
            - name: LINGBOT_CTE_PRIOR_FULL
              value: "1"
            - name: LINGBOT_CTE_EXP_SPLIT
              value: "2"
            - name: LINGBOT_T5_FP32
              value: "1"
            - name: LINGBOT_VAE_2D
              value: "1"
            - name: LINGBOT_VAE_T
              value: "6"
            - name: LINGBOT_VAE_NORM
              value: "mm"
            - name: LINGBOT_VAE_CC_FLAGS
              value: "-O1"
            - name: LINGBOT_VAE_BF16
              value: "1"
            - name: LINGBOT_VAE_FUSED
              value: "1"
            - name: LINGBOT_STEP_NOWRITE
              value: "1"
            - name: LINGBOT_K_BLOCKED
              value: "1"
            - name: NKI_ENABLE_TRACE_CACHE
              value: "0"
            - name: LINGBOT_CTE_VGROUP
              value: "8"
            - name: LINGBOT_CTE_LOCAL
              value: "1"
            - name: LINGBOT_IMG_BLOCK
              value: "1"
            - name: LINGBOT_KEY_THREADS
              value: "4"
            - name: LINGBOT_COMMIT_NOHEAD
              value: "1"
            - name: LINGBOT_EMPTY_CACHE_SEQ
              value: "1000000000"
            - name: LINGBOT_PREUPLOAD
              value: "1"
            - name: LINGBOT_CROSS_NMAJOR
              value: "1"
            - name: LINGBOT_HEAD_COMPILE
              value: "1"
            - name: LINGBOT_FILM_BATCH
              value: "1"
            - name: LINGBOT_PLUCKER_COMPILE
              value: "1"
            - name: LINGBOT_ATTN_PAIR
              value: "1"
            - name: LINGBOT_ATTN_EARLY
              value: "2"
            - name: LINGBOT_TOKEN_PAD
              value: "32"
            - name: LINGBOT_NO_SYNC
              value: "1"
            - name: LINGBOT_SKIP_LAST_COMMIT
              value: "1"
            - name: LINGBOT_LOAD_CONCURRENCY
              value: "16"
            - name: NEURON_LAUNCH_BLOCKING
              value: "0"
            - name: LINGBOT_FILM_A2A
              value: "1"
            - name: LINGBOT_CTE_MERGE
              value: "1"
            - name: LINGBOT_SP
              value: "1"
            - name: LINGBOT_HOT_ATTN
              value: "cte"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NPROC
              value: "16"
            - name: LNC
              value: "2"
            - name: CP
              value: "4"
            - name: TP
              value: "4"
            - name: SIZE
              value: "480*768"
            - name: FRAME_NUM
              value: "81"
            - name: CHUNK_SIZE
              value: "3"
            - name: LOCAL_ATTN_SIZE
              value: "12"
            - name: SINK_SIZE
              value: "1"
            - name: DENOISE_STEPS
              value: "4"
            - name: PROMPT
              value: "gentle ripples spreading across the calm lake water, tree leaves swaying softly in the breeze, clouds drifting slowly across the blue sky, cinematic slow camera push-in, serene natural motion"
            - name: LINGBOT_BENCH_RUNS
              value: "3"
            - name: LINGBOT_CHUNKED_KV
              value: "1"
            - name: LINGBOT_COMPILE_DIT
              value: "1"
            - name: COMPILE_SCOPE
              value: "blocks"
            - name: LINGBOT_CP_FLAT_SEQ
              value: "1"
            - name: ATTENTION_BACKEND
              value: "cte"
            - name: NEURON_CC_FLAGS
              value: "--internal-backend-options=--disable-cb-before-global-cc"
            - name: NKI_COMPILER_FRONTEND
              value: "tracer"
            - name: NEURON_FALLBACK_ENABLED
              value: "1"
            - name: TORCH_NEURONX_DISABLE_FALLBACK_EXECUTION
              value: "1"
            - name: NEURON_RT_EXEC_TIMEOUT
              value: "600"
            - name: NEURON_RT_ASYNC_EXEC_MAX_INFLIGHT_REQUESTS
              value: "0"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            - name: NEURON_LOAD_CONCURRENCY
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
      volumes:
        - name: node-cache
          hostPath:
            path: /opt/lingbot-world-v2
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
