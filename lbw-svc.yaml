# Services: lbw-v2 (serve.py, lbw-deploy.yaml), lbw-vae (vae_serve.py, lbw-vae-deploy.yaml) and lbw-web (web_app.py, lbw-web-deploy.yaml).
# ClusterIP only; outside access goes through the ALB in lbw-ing.yaml.
apiVersion: v1
kind: Service
metadata:
  name: lbw-v2
spec:
  selector:
    app: lbw-v2
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: lbw-web
spec:
  type: ClusterIP
  selector:
    app: lbw-web
  ports:
    - port: 7860
      targetPort: 7860
---
apiVersion: v1
kind: Service
metadata:
  name: lbw-vae
spec:
  selector:
    app: lbw-vae
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: lbw-dit
spec:
  selector:
    app: lbw-dit
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: lbw-rdma-store
spec:
  selector:
    app: lbw-rdma-store
  ports:
    - port: 29600
      targetPort: 29600
