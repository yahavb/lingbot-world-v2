# lbw-rdma-store: the cluster's one rendezvous store (a TCPStore server, tools/rdma_store.py) for the DiT<->VAE
# RDMA links. Every lbw-dit and lbw-vae process connects to it for its whole life (the Neuron backend binds a
# process to the first store it rendezvoused on). No Neuron device. Service: lbw-svc.yaml. If it restarts,
# restart lbw-dit and lbw-vae too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lbw-rdma-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lbw-rdma-store
  template:
    metadata:
      labels:
        app: lbw-rdma-store
    spec:
      nodeSelector:
        node-type: trn3-dev1
      containers:
        - name: store
          image: public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04
          command: [/bin/bash, -c, 'git clone -q -b "$BRANCH" https://github.com/yahavb/lingbot-world-v2.git /tmp/lingbot && exec python3 /tmp/lingbot/tools/rdma_store.py']
          env:
            - {name: BRANCH, value: main}
            - {name: TORCH_DEVICE_BACKEND_AUTOLOAD, value: "0"}
            - {name: PYTHONUNBUFFERED, value: "1"}
          ports:
            - containerPort: 29600
          readinessProbe:
            tcpSocket: {port: 29600}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
