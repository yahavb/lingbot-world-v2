# e2e-latency-optimization candidates 1+2 (K=1280 linears bf16, tuned q/k/v + FFN tiles): e2e + gate dumps (perf/k8s_sweep.sh) on 4 trn3 devices at LNC1 (l-lnc1, 32 ranks, TP4 x CP8) with lbw-bench-job.yaml's flags (its 4-chip config ran).
# the steady-state GEN / VAE times: fps = 81 / (GEN + VAE), the k8s_sweep definition (17.88 fps).
# LINGBOT_FFN_MX=1 runs the FFN in MXFP8 (kernels/ffn_mx.py). The video is written to /tmp/results.
apiVersion: batch/v1
kind: Job
metadata:
  name: lbw-e2e-mx-lnc1-dge
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3-dev1
        kubernetes.io/hostname: ip-192-168-192-229.us-east-2.compute.internal
      resourceClaims:
        - name: neuroncores
          resourceClaimTemplateName: l-lnc1
      containers:
        - name: inference
          image: public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04
          command:
            - /bin/bash
            - "-c"
            - |
              set -euo pipefail
              git clone -b "$BRANCH" https://github.com/yahavb/lingbot-world-v2.git /tmp/lingbot
              cd /tmp/lingbot
              echo "commit: $(git log --oneline -1)"
              OUT=/tmp/results; mkdir -p "$OUT"
              trap 'echo "kubectl cp $(hostname):$OUT ./results"; sleep "${KEEP_ALIVE_SECONDS:-7200}"' EXIT
              CKPT=/node-cache/lingbot-world-v2-14b-causal-fast
              [ -f "$CKPT/.complete" ] || { echo "no ckpt on this node"; exit 1; }
              SAVE="$OUT/lbw_ffnmx${LINGBOT_FFN_MX}_cp${CP}xtp${TP}_${SIZE//\*/x}_${FRAME_NUM}f.mp4"
              LATENTS=$OUT/latents.pt
              export NEURON_COMPILE_CACHE_URL=/var/tmp/neuron-compile-cache
              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              export TORCH_NEURONX_HLO_CACHE_DIR=/var/tmp/hlo_cache
              export HF_HOME=/tmp/hf-cache
              pip install -q -r requirements_neuron.txt
              python3 -c "import torchvision" 2>/dev/null || bash install_neuron.sh

              python3 scripts/analysis/qk_gamma_temperature.py --ckpt_dir "$CKPT" | tee /tmp/qk.txt
              export FLASH_ATTN_LAYERS=$(grep -oE "CANDIDATE HOT LAYERS \([0-9]+\): [0-9,]+" /tmp/qk.txt | sed -E "s/.*: //" || true)
              # e2e-latency-optimization step 1-2: 3 warm passes, repeat run, gate dumps, c0s0 vs fp32, VAE vs fp32 decode
              export OUT=/node-cache/e2e/mx-lnc1-dge CKPT LNC=1 NPROC=32 LAYOUTS="4x8" REPEAT=4x8 BENCH_RUNS=3
              export EXTRA_FLAGS="LINGBOT_FFN_MX=1 LINGBOT_LIN_MX=1 LINGBOT_LIN_MX_SKIP=self_attn.o:cross_attn.o:cam_injector_layer2 LINGBOT_MX_TUNED=1 LINGBOT_CTE_KV_DGE=hwdge_sync LINGBOT_WT_PRE=1 LINGBOT_ATTN_FMAJ=1 LINGBOT_FFN_FMAJ=1 LINGBOT_VAE_GATHER1=1 LINGBOT_FILM_ALL_CHUNKS=3 LINGBOT_FILM_ALL_BLOCKS=10 LINGBOT_FILM_ALL=0 LINGBOT_BLOCK_GROUP=2 LINGBOT_CTE_SCALAR_ROWMAX=1 LINGBOT_CTE_PRIOR_FULL=1 LINGBOT_CTE_EXP_SPLIT=2 LINGBOT_T5_FP32=1 LINGBOT_VAE_2D=1 LINGBOT_VAE_T=6 LINGBOT_VAE_NORM=mm LINGBOT_VAE_CC_FLAGS=-O1 LINGBOT_VAE_BF16=1 LINGBOT_VAE_FUSED=1 LINGBOT_STEP_NOWRITE=1 LINGBOT_K_BLOCKED=1 NKI_ENABLE_TRACE_CACHE=0 LINGBOT_CTE_VGROUP=8 LINGBOT_CTE_LOCAL=1 LINGBOT_IMG_BLOCK=1 LINGBOT_KEY_THREADS=4 LINGBOT_COMMIT_NOHEAD=1 LINGBOT_EMPTY_CACHE_SEQ=1000000000 LINGBOT_PREUPLOAD=1 LINGBOT_CROSS_NMAJOR=1 LINGBOT_HEAD_COMPILE=1 LINGBOT_FILM_BATCH=1 LINGBOT_PLUCKER_COMPILE=1 LINGBOT_ATTN_PAIR=1 LINGBOT_ATTN_EARLY=2 LINGBOT_TOKEN_PAD=32 LINGBOT_NO_SYNC=1 LINGBOT_SKIP_LAST_COMMIT=1 LINGBOT_LOAD_CONCURRENCY=16 NEURON_LAUNCH_BLOCKING=0 LINGBOT_FILM_A2A=1 LINGBOT_CTE_MERGE=1 LINGBOT_SP=1 LINGBOT_HOT_ATTN=cte LINGBOT_CHUNKED_KV=1 LINGBOT_COMPILE_DIT=1 COMPILE_SCOPE=blocks LINGBOT_CP_FLAT_SEQ=1 ATTENTION_BACKEND=cte NEURON_CC_FLAGS=--internal-backend-options=--disable-cb-before-global-cc NKI_COMPILER_FRONTEND=tracer NEURON_FALLBACK_ENABLED=1 TORCH_NEURONX_DISABLE_FALLBACK_EXECUTION=1 NEURON_RT_EXEC_TIMEOUT=600 NEURON_RT_ASYNC_EXEC_MAX_INFLIGHT_REQUESTS=0 NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE=134217728 NEURON_LOAD_CONCURRENCY=8 NEURON_RT_LOG_LEVEL=ERROR NEURON_CC_LOG_LEVEL=ERROR"
              mkdir -p "$OUT"; git log --oneline -1 > "$OUT/COMMIT"
              bash perf/k8s_sweep.sh 2>&1 | tee "$OUT/sweep.txt"
              echo "SWEEP DONE"
          resources:
            claims:
              - name: neuroncores
            requests:
              cpu: "40"
              memory: 600Gi
              ephemeral-storage: 300Gi
            limits:
              memory: 900Gi
              ephemeral-storage: 300Gi
          volumeMounts:
            - name: node-cache
              mountPath: /node-cache
            - name: dshm
              mountPath: /dev/shm
          env:
            - name: LINGBOT_FFN_MX
              value: "1"
            - name: LINGBOT_LIN_MX
              value: "1"
            - name: BRANCH
              value: "mxfp8"
            - name: LINGBOT_WT_PRE
              value: "1"
            - name: LINGBOT_ATTN_FMAJ
              value: "1"
            - name: LINGBOT_FFN_FMAJ
              value: "1"
            - name: LINGBOT_VAE_GATHER1
              value: "1"
            - name: LINGBOT_FILM_ALL_CHUNKS
              value: "3"
            - name: LINGBOT_FILM_ALL_BLOCKS
              value: "10"
            - name: LINGBOT_FILM_ALL
              value: "0"
            - name: LINGBOT_BLOCK_GROUP
              value: "2"
            - name: LINGBOT_CTE_SCALAR_ROWMAX
              value: "1"
            - name: LINGBOT_CTE_PRIOR_FULL
              value: "1"
            - name: LINGBOT_CTE_EXP_SPLIT
              value: "2"
            - name: LINGBOT_T5_FP32
              value: "1"
            - name: LINGBOT_VAE_2D
              value: "1"
            - name: LINGBOT_VAE_T
              value: "6"
            - name: LINGBOT_VAE_NORM
              value: "mm"
            - name: LINGBOT_VAE_CC_FLAGS
              value: "-O1"
            - name: LINGBOT_VAE_BF16
              value: "1"
            - name: LINGBOT_VAE_FUSED
              value: "1"
            - name: LINGBOT_STEP_NOWRITE
              value: "1"
            - name: LINGBOT_K_BLOCKED
              value: "1"
            - name: NKI_ENABLE_TRACE_CACHE
              value: "0"
            - name: LINGBOT_CTE_VGROUP
              value: "8"
            - name: LINGBOT_CTE_LOCAL
              value: "1"
            - name: LINGBOT_IMG_BLOCK
              value: "1"
            - name: LINGBOT_KEY_THREADS
              value: "4"
            - name: LINGBOT_COMMIT_NOHEAD
              value: "1"
            - name: LINGBOT_EMPTY_CACHE_SEQ
              value: "1000000000"
            - name: LINGBOT_PREUPLOAD
              value: "1"
            - name: LINGBOT_CROSS_NMAJOR
              value: "1"
            - name: LINGBOT_HEAD_COMPILE
              value: "1"
            - name: LINGBOT_FILM_BATCH
              value: "1"
            - name: LINGBOT_PLUCKER_COMPILE
              value: "1"
            - name: LINGBOT_ATTN_PAIR
              value: "1"
            - name: LINGBOT_ATTN_EARLY
              value: "2"
            - name: LINGBOT_TOKEN_PAD
              value: "32"
            - name: LINGBOT_NO_SYNC
              value: "1"
            - name: LINGBOT_SKIP_LAST_COMMIT
              value: "1"
            - name: LINGBOT_LOAD_CONCURRENCY
              value: "16"
            - name: NEURON_LAUNCH_BLOCKING
              value: "0"
            - name: LINGBOT_FILM_A2A
              value: "1"
            - name: LINGBOT_CTE_MERGE
              value: "1"
            - name: LINGBOT_SP
              value: "1"
            - name: LINGBOT_HOT_ATTN
              value: "cte"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NPROC
              value: "32"
            - name: LNC
              value: "1"
            - name: CP
              value: "8"
            - name: TP
              value: "4"
            - name: SIZE
              value: "480*768"
            - name: FRAME_NUM
              value: "81"
            - name: CHUNK_SIZE
              value: "3"
            - name: LOCAL_ATTN_SIZE
              value: "12"
            - name: SINK_SIZE
              value: "1"
            - name: DENOISE_STEPS
              value: "4"
            - name: PROMPT
              value: "gentle ripples spreading across the calm lake water, tree leaves swaying softly in the breeze, clouds drifting slowly across the blue sky, cinematic slow camera push-in, serene natural motion"
            - name: LINGBOT_BENCH_RUNS
              value: "2"
            - name: LINGBOT_CHUNKED_KV
              value: "1"
            - name: LINGBOT_COMPILE_DIT
              value: "1"
            - name: COMPILE_SCOPE
              value: "blocks"
            - name: LINGBOT_CP_FLAT_SEQ
              value: "1"
            - name: ATTENTION_BACKEND
              value: "cte"
            - name: NEURON_CC_FLAGS
              value: "--internal-backend-options=--disable-cb-before-global-cc"
            - name: NKI_COMPILER_FRONTEND
              value: "tracer"
            - name: NEURON_FALLBACK_ENABLED
              value: "1"
            - name: TORCH_NEURONX_DISABLE_FALLBACK_EXECUTION
              value: "1"
            - name: NEURON_RT_EXEC_TIMEOUT
              value: "600"
            - name: NEURON_RT_ASYNC_EXEC_MAX_INFLIGHT_REQUESTS
              value: "0"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            - name: NEURON_LOAD_CONCURRENCY
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
      volumes:
        - name: node-cache
          hostPath:
            path: /opt/lingbot-world-v2
            type: Directory
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
