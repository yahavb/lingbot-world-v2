# 4 trn3 devices at LNC2 + their 4 EFAs, one devicegroup4 (lbw-dit). Generated by perf/disagg/mk.py claim 4.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: x-lnc2-efa-4
  namespace: default
spec:
  metadata: {}
  spec:
    devices:
      config:
      - opaque:
          driver: neuron.aws.com
          parameters:
            apiVersion: neuron.aws.com/v1
            kind: NeuronConfig
            logicalNeuronCore: 2
        requests:
        - neurons
      constraints:
      - matchAttribute: resource.aws.com/devicegroup4_id
        requests:
        - neurons
        - efas
      requests:
      - exactly:
          allocationMode: ExactCount
          count: 4
          deviceClassName: neuron.aws.com
          selectors:
          - cel:
              expression: device.attributes['neuron.aws.com'].instanceType == 'trn3-dev1.48xlarge'
        name: neurons
      - exactly:
          allocationMode: ExactCount
          count: 4
          deviceClassName: efa.networking.k8s.aws
        name: efas
