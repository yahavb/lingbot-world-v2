# Streaming VAE decode server (vae_serve.py) for lbw-v2-dit-t5: 4 trn3 devices, 32 ranks, the
# fused decoder on 4 x 8 height x width tiles (LINGBOT_VAE_FUSED / _2D), 3 latent frames per step.
apiVersion: v1
kind: Service
metadata:
  name: lbw-v2-vae
spec:
  selector:
    app: lbw-v2-vae
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lbw-v2-vae
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lbw-v2-vae
  template:
    metadata:
      labels:
        app: lbw-v2-vae
    spec:
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neuroncores
          resourceClaimTemplateName: l-lnc1
      containers:
        - name: inference
          image: public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04
          command:
            - /bin/bash
            - "-c"
            - |
              set -euo pipefail
              git clone -b "$BRANCH" https://github.com/yahavb/lingbot-world-v2.git /tmp/lingbot
              cd /tmp/lingbot
              echo "commit: $(git log --oneline -1)"
              CKPT=/tmp/ckpt/lingbot-world-v2-14b-causal-fast
              export NEURON_COMPILE_CACHE_URL=/var/tmp/neuron-compile-cache
              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              export HF_HOME=/tmp/hf-cache

              pip install -q -r requirements_neuron.txt huggingface_hub fastapi uvicorn
              python3 -c "import torchvision" 2>/dev/null || bash install_neuron.sh
              hf download robbyant/lingbot-world-v2-14b-causal-fast Wan2.1_VAE.pth --local-dir "$CKPT"

              NEURON_LOGICAL_NC_CONFIG="$LNC" torchrun --nproc_per_node="$NPROC" vae_serve.py \
                --ckpt_dir "$CKPT" --lat_h "$LAT_H" --lat_w "$LAT_W" --chunk_size "$CHUNK_SIZE" 2>&1 \
                | tee -a /logs/serve.log | grep --line-buffered -avE "AliasingInfo|Mutated inputs|Detected collective"
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /readiness
              port: 8000
            periodSeconds: 30
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 10
          resources:
            claims:
              - name: neuroncores
            requests:
              cpu: "44"
              memory: 450Gi
              ephemeral-storage: 100Gi
            limits:
              cpu: "47"
              memory: 475Gi
              ephemeral-storage: 100Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: logs
              mountPath: /logs
          env:
            - name: BRANCH
              value: "live-controls"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NPROC
              value: "32"
            - name: LNC
              value: "1"
            - name: LAT_H
              value: "60"
            - name: LAT_W
              value: "96"
            - name: CHUNK_SIZE
              value: "3"
            - name: LINGBOT_VAE_FUSED
              value: "1"
            - name: LINGBOT_VAE_2D
              value: "1"
            - name: LINGBOT_VAE_BF16
              value: "1"
            - name: LINGBOT_VAE_CC_FLAGS
              value: "-O1"
            - name: LINGBOT_VAE_NORM
              value: "mm"
            - name: LINGBOT_VAE_T
              value: "3"
            - name: LINGBOT_VAE_PER_DEVICE
              value: "4"
            - name: NEURON_CC_FLAGS
              value: "--internal-backend-options=--disable-cb-before-global-cc"
            - name: NKI_COMPILER_FRONTEND
              value: "tracer"
            - name: NEURON_FALLBACK_ENABLED
              value: "1"
            - name: TORCH_NEURONX_DISABLE_FALLBACK_EXECUTION
              value: "1"
            - name: NEURON_RT_EXEC_TIMEOUT
              value: "600"
            - name: NEURON_RT_ASYNC_EXEC_MAX_INFLIGHT_REQUESTS
              value: "0"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            - name: NEURON_LOAD_CONCURRENCY
              value: "8"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
