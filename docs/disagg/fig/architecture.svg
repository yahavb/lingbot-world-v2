<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='600' viewBox='0 0 1000 600' font-family='Helvetica, Arial, sans-serif'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker><marker id='c' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='4' markerHeight='4' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#eb6834'/></marker></defs>
<rect width='1000' height='600' fill='#fcfcfb'/>
<text x='24' y='30' font-size='16' font-weight='600' fill='#0b0b0b'>How a session is served: two pools that scale independently</text>
<rect x='30' y='230' width='120' height='60' rx='8' fill='#ffffff' stroke='#52514e' stroke-width='2'/>
<text x='90.0' y='256.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>Client</text>
<text x='90.0' y='272.0' font-size='10' text-anchor='middle' fill='#52514e'>actions in, frames out</text>
<rect x='190' y='220' width='150' height='80' rx='8' fill='#f3f2ee' stroke='#52514e' stroke-width='2'/>
<text x='265.0' y='256.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>Session manager</text>
<text x='265.0' y='272.0' font-size='10' text-anchor='middle' fill='#52514e'>opens and tracks sessions</text>
<line x1='150' y1='252' x2='190' y2='252' stroke='#52514e' stroke-width='1.8' stroke-dasharray='' marker-end='url(#a)'/>
<line x1='190' y1='270' x2='150' y2='270' stroke='#52514e' stroke-width='1.8' stroke-dasharray='' marker-end='url(#a)'/>
<text x='170' y='244' font-size='10' text-anchor='middle' fill='#52514e'>1</text>
<text x='170' y='286' font-size='10' text-anchor='middle' fill='#52514e'>4</text>
<rect x='380' y='60' width='250' height='420' rx='12' fill='none' stroke='#2a78d6' stroke-width='2' stroke-dasharray='6 4'/>
<text x='394' y='82' font-size='13' font-weight='600' fill='#0b0b0b'>DiT pool (DiT + T5)</text>
<text x='394' y='98' font-size='10' text-anchor='start' fill='#52514e'>any Ready pod takes a new session</text>
<rect x='400' y='112' width='210' height='70' rx='8' fill='#ffffff' stroke='#2a78d6' stroke-width='2'/>
<text x='505.0' y='143.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>DiT pod 1</text>
<text x='505.0' y='159.0' font-size='10' text-anchor='middle' fill='#52514e'>one session at a time · n_d chips</text>
<rect x='400' y='202' width='210' height='70' rx='8' fill='#ffffff' stroke='#2a78d6' stroke-width='2'/>
<text x='505.0' y='233.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>DiT pod 2</text>
<text x='505.0' y='249.0' font-size='10' text-anchor='middle' fill='#52514e'>one session at a time · n_d chips</text>
<rect x='400' y='292' width='210' height='70' rx='8' fill='#ffffff' stroke='#2a78d6' stroke-width='2'/>
<text x='505.0' y='323.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>DiT pod R_d</text>
<text x='505.0' y='339.0' font-size='10' text-anchor='middle' fill='#52514e'>one session at a time · n_d chips</text>
<text x='505' y='382' font-size='16' text-anchor='middle' fill='#52514e'>...</text>
<text x='394' y='410' font-size='12' text-anchor='start' fill='#2a78d6'>scale out: add DiT pods</text>
<text x='394' y='428' font-size='11' text-anchor='start' fill='#2a78d6'>= more concurrent sessions</text>
<line x1='340' y1='260' x2='380' y2='260' stroke='#52514e' stroke-width='1.8' stroke-dasharray='' marker-end='url(#a)'/>
<text x='360' y='248' font-size='11' text-anchor='middle' fill='#52514e'>2</text>
<text x='358' y='284' font-size='9' text-anchor='middle' fill='#2a78d6'>bound</text>
<text x='358' y='295' font-size='9' text-anchor='middle' fill='#2a78d6'>(KV</text>
<text x='358' y='306' font-size='9' text-anchor='middle' fill='#2a78d6'>cache)</text>
<rect x='690' y='60' width='280' height='420' rx='12' fill='none' stroke='#eb6834' stroke-width='2' stroke-dasharray='6 4'/>
<text x='704' y='82' font-size='13' font-weight='600' fill='#0b0b0b'>VAE pool</text>
<text x='704' y='98' font-size='10' text-anchor='start' fill='#52514e'>any Ready pod with an open slot</text>
<rect x='710' y='112' width='240' height='90' rx='8' fill='#ffffff' stroke='#eb6834' stroke-width='2'/>
<text x='830.0' y='157.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>VAE pod 1</text>
<rect x='730' y='164' width='44' height='24' rx='4' fill='#eb6834'/>
<text x='752' y='180' font-size='10' text-anchor='middle' fill='#ffffff'>slot 1</text>
<rect x='782' y='164' width='44' height='24' rx='4' fill='#eb6834'/>
<text x='804' y='180' font-size='10' text-anchor='middle' fill='#ffffff'>slot 2</text>
<rect x='834' y='164' width='44' height='24' rx='4' fill='#eb6834'/>
<text x='856' y='180' font-size='10' text-anchor='middle' fill='#ffffff'>slot 3</text>
<rect x='886' y='164' width='44' height='24' rx='4' fill='#c9c7c0'/>
<text x='908' y='180' font-size='10' text-anchor='middle' fill='#ffffff'>slot 4</text>
<rect x='710' y='222' width='240' height='90' rx='8' fill='#ffffff' stroke='#eb6834' stroke-width='2'/>
<text x='830.0' y='267.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>VAE pod R_v</text>
<rect x='730' y='274' width='44' height='24' rx='4' fill='#c9c7c0'/>
<text x='752' y='290' font-size='10' text-anchor='middle' fill='#ffffff'>slot 1</text>
<rect x='782' y='274' width='44' height='24' rx='4' fill='#c9c7c0'/>
<text x='804' y='290' font-size='10' text-anchor='middle' fill='#ffffff'>slot 2</text>
<rect x='834' y='274' width='44' height='24' rx='4' fill='#c9c7c0'/>
<text x='856' y='290' font-size='10' text-anchor='middle' fill='#ffffff'>slot 3</text>
<rect x='886' y='274' width='44' height='24' rx='4' fill='#c9c7c0'/>
<text x='908' y='290' font-size='10' text-anchor='middle' fill='#ffffff'>slot 4</text>
<text x='830' y='330' font-size='16' text-anchor='middle' fill='#52514e'>...</text>
<text x='704' y='360' font-size='11' text-anchor='start' fill='#52514e'>K open slots per VAE pod: it serves</text>
<text x='704' y='376' font-size='11' text-anchor='start' fill='#52514e'>up to K sessions (~ T_d / T_v keep up)</text>
<text x='704' y='410' font-size='12' text-anchor='start' fill='#eb6834'>scale out: add VAE pods</text>
<text x='704' y='428' font-size='11' text-anchor='start' fill='#eb6834'>= more open slots</text>
<line x1='630' y1='260' x2='690' y2='260' stroke='#eb6834' stroke-width='2.4' stroke-dasharray='' marker-end='url(#a)'/>
<path d='M 668 244 A 17 17 0 1 0 676 266' fill='none' stroke='#eb6834' stroke-width='2' marker-end='url(#c)'/>
<text x='660' y='232' font-size='11' text-anchor='middle' fill='#52514e'>3</text>
<text x='660' y='296' font-size='9' text-anchor='middle' fill='#eb6834'>any VAE</text>
<text x='660' y='307' font-size='9' text-anchor='middle' fill='#eb6834'>least-loaded</text>
<text x='660' y='318' font-size='9' text-anchor='middle' fill='#eb6834'>failover ~3 s</text>
<path d='M 830 480 L 830 500 L 265 500 L 265 300' fill='none' stroke='#52514e' stroke-width='1.6' stroke-dasharray='5 4' marker-end='url(#a)'/>
<text x='560' y='516' font-size='11' text-anchor='middle' fill='#52514e'>4 frames back through the session manager to the client</text>
<text x='24' y='556' font-size='11' fill='#52514e'>1 the client opens a session. 2 any Ready DiT pod takes it; the session is bound to that pod (it holds the KV cache).</text>
<text x='24' y='572' font-size='11' fill='#52514e'>3 the DiT streams its latents to any VAE pod with a free slot (least loaded); if that VAE fails, another takes over in ~3 s. 4 frames back.</text>
<text x='24' y='588' font-size='11' fill='#52514e'>Each role scales on its own: DiT pods for more sessions, VAE pods for more open slots. Kubernetes DRA gives each pod its Neuron devices + EFAs.</text>
</svg>