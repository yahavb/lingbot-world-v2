<svg xmlns='http://www.w3.org/2000/svg' width='980' height='560' viewBox='0 0 980 560' font-family='Helvetica, Arial, sans-serif'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker></defs>
<rect width='980' height='560' fill='#fcfcfb'/>
<text x='24' y='30' font-size='16' font-weight='600' fill='#0b0b0b'>Role-disaggregated serving: two pools that scale independently</text>
<rect x='400' y='48' width='180' height='44' rx='8' fill='#ffffff' stroke='#52514e' stroke-width='2'/>
<text x='490.0' y='68.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>Clients (sessions)</text>
<text x='490.0' y='84.0' font-size='10' text-anchor='middle' fill='#52514e'>actions in, frames out</text>
<rect x='330' y='116' width='320' height='50' rx='8' fill='#f3f2ee' stroke='#52514e' stroke-width='2'/>
<text x='490.0' y='139.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>Scheduler</text>
<text x='490.0' y='155.0' font-size='10' text-anchor='middle' fill='#52514e'>places each session: a DiT replica + the least-loaded VAE</text>
<line x1='490' y1='92' x2='490' y2='116' stroke='#52514e' stroke-width='1.6' marker-end='url(#a)'/>
<rect x='40' y='196' width='380' height='250' rx='12' fill='none' stroke='#2a78d6' stroke-width='2' stroke-dasharray='6 4'/>
<text x='56' y='218' font-size='13' font-weight='600' fill='#0b0b0b'>DiT pool (denoise): R_d replicas</text>
<rect x='60' y='240' width='100' height='64' rx='8' fill='#ffffff' stroke='#2a78d6' stroke-width='2'/>
<text x='110.0' y='270.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>DiT 1</text>
<text x='110.0' y='286.0' font-size='10' text-anchor='middle' fill='#52514e'>n_d chips</text>
<rect x='180' y='240' width='100' height='64' rx='8' fill='#ffffff' stroke='#2a78d6' stroke-width='2'/>
<text x='230.0' y='270.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>DiT 2</text>
<text x='230.0' y='286.0' font-size='10' text-anchor='middle' fill='#52514e'>n_d chips</text>
<rect x='300' y='240' width='100' height='64' rx='8' fill='#ffffff' stroke='#2a78d6' stroke-width='2'/>
<text x='350.0' y='270.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>DiT R_d</text>
<text x='350.0' y='286.0' font-size='10' text-anchor='middle' fill='#52514e'>n_d chips</text>
<text x='290' y='278' font-size='16' text-anchor='middle' fill='#52514e'>...</text>
<text x='56' y='376' font-size='11' fill='#52514e'>each replica: n_d devices + paired EFAs (DRA claim),</text>
<text x='56' y='392' font-size='11' fill='#52514e'>TP x CP, per-stream KV cache</text>
<text x='56' y='420' font-size='12' font-weight='600' fill='#2a78d6'>scale out: add DiT replicas (more streams)</text>
<rect x='560' y='196' width='380' height='250' rx='12' fill='none' stroke='#eb6834' stroke-width='2' stroke-dasharray='6 4'/>
<text x='576' y='218' font-size='13' font-weight='600' fill='#0b0b0b'>VAE pool (decode): R_v replicas</text>
<rect x='580' y='240' width='100' height='64' rx='8' fill='#ffffff' stroke='#eb6834' stroke-width='2'/>
<text x='630.0' y='270.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>VAE 1</text>
<text x='630.0' y='286.0' font-size='10' text-anchor='middle' fill='#52514e'>n_v chips</text>
<rect x='700' y='240' width='100' height='64' rx='8' fill='#ffffff' stroke='#eb6834' stroke-width='2'/>
<text x='750.0' y='270.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>VAE 2</text>
<text x='750.0' y='286.0' font-size='10' text-anchor='middle' fill='#52514e'>n_v chips</text>
<rect x='820' y='240' width='100' height='64' rx='8' fill='#ffffff' stroke='#eb6834' stroke-width='2'/>
<text x='870.0' y='270.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>VAE R_v</text>
<text x='870.0' y='286.0' font-size='10' text-anchor='middle' fill='#52514e'>n_v chips</text>
<text x='810' y='278' font-size='16' text-anchor='middle' fill='#52514e'>...</text>
<text x='576' y='376' font-size='11' fill='#52514e'>each replica: K sessions, a causal cache each,</text>
<text x='576' y='392' font-size='11' fill='#52514e'>serves ~ T_d / T_v DiT streams</text>
<text x='576' y='420' font-size='12' font-weight='600' fill='#eb6834'>scale out: add VAE replicas (keep the ratio)</text>
<line x1='110' y1='336' x2='870' y2='336' stroke='#52514e' stroke-width='4'/>
<line x1='110' y1='304' x2='110' y2='336' stroke='#2a78d6' stroke-width='2'/>
<line x1='230' y1='304' x2='230' y2='336' stroke='#2a78d6' stroke-width='2'/>
<line x1='350' y1='304' x2='350' y2='336' stroke='#2a78d6' stroke-width='2'/>
<line x1='630' y1='336' x2='630' y2='304' stroke='#eb6834' stroke-width='2' marker-end='url(#a)'/>
<line x1='750' y1='336' x2='750' y2='304' stroke='#eb6834' stroke-width='2' marker-end='url(#a)'/>
<line x1='870' y1='336' x2='870' y2='304' stroke='#eb6834' stroke-width='2' marker-end='url(#a)'/>
<text x='490' y='314' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>latent fabric</text>
<text x='490' y='328' font-size='11' text-anchor='middle' fill='#0b0b0b'>any DiT to any VAE</text>
<text x='490' y='354' font-size='10' text-anchor='middle' fill='#52514e'>NIXL over EFA</text>
<text x='490' y='368' font-size='10' text-anchor='middle' fill='#52514e'>or NeuronLink</text>
<text x='490' y='382' font-size='10' text-anchor='middle' fill='#52514e'>1.1 MB, 0.17 ms</text>
<line x1='400' y1='166' x2='230' y2='196' stroke='#52514e' stroke-width='1.6' marker-end='url(#a)'/>
<line x1='580' y1='166' x2='750' y2='196' stroke='#52514e' stroke-width='1.6' marker-end='url(#a)'/>
<path d='M 940 260 C 975 200, 975 80, 580 70' fill='none' stroke='#52514e' stroke-width='1.4' stroke-dasharray='4 3' marker-end='url(#a)'/>
<text x='920' y='120' font-size='10' fill='#52514e' text-anchor='end'>frames back</text>
<rect x='40' y='470' width='900' height='40' rx='8' fill='#f3f2ee' stroke='#52514e' stroke-width='2'/>
<text x='490.0' y='488.0' font-size='12' font-weight='600' text-anchor='middle' fill='#0b0b0b'>Amazon EKS + Neuron DRA: device-and-EFA claims per role; pod discovery, least-loaded placement, failover</text>
<text x='40' y='536' font-size='11' fill='#52514e'>Sizing: n_d, n_v from each stage's scaling curve; ratio R_v = ceil(R_d * T_v / T_d). Co-located instead: every chip runs both stages, T_d(N) + T_v(N) per chunk.</text>
</svg>