<svg xmlns='http://www.w3.org/2000/svg' width='980' height='520' viewBox='0 0 980 520' font-family='Helvetica, Arial, sans-serif'>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker></defs>
<rect width='980' height='520' fill='#fcfcfb'/>
<text x='24' y='30' font-size='16' font-weight='600' fill='#0b0b0b'>Role-disaggregated serving on Amazon EKS + Trainium</text>
<rect x='24' y='200' width='150' height='90' rx='8' fill='#ffffff' stroke='#52514e' stroke-width='2'/>
<text x='36' y='222' font-size='13' font-weight='600' fill='#0b0b0b'>Clients</text>
<text x='36' y='242' font-size='11' fill='#52514e'>sessions: prompt, scene,</text>
<text x='36' y='258' font-size='11' fill='#52514e'>actions (keys / robot)</text>
<text x='36' y='274' font-size='11' fill='#52514e'>frames back (HTTP)</text>
<rect x='220' y='60' width='300' height='400' rx='12' fill='none' stroke='#2a78d6' stroke-width='2' stroke-dasharray='5 4'/>
<text x='236' y='84' font-size='13' font-weight='600' fill='#0b0b0b'>Denoiser role (DiT + T5): R_d replicas</text>
<rect x='240' y='100' width='260' height='96' rx='8' fill='#ffffff' stroke='#2a78d6' stroke-width='2'/>
<text x='252' y='122' font-size='13' font-weight='600' fill='#0b0b0b'>DiT replica 1</text>
<text x='252' y='142' font-size='11' fill='#52514e'>DRA claim: n_d Neuron devices,</text>
<text x='252' y='158' font-size='11' fill='#52514e'>each paired with its EFA</text>
<text x='252' y='174' font-size='11' fill='#52514e'>TP x CP, KV cache per stream</text>
<text x='252' y='190' font-size='11' fill='#52514e'>rank 0: NIXL agent</text>
<rect x='240' y='210' width='260' height='96' rx='8' fill='#ffffff' stroke='#2a78d6' stroke-width='2'/>
<text x='252' y='232' font-size='13' font-weight='600' fill='#0b0b0b'>DiT replica 2</text>
<text x='252' y='252' font-size='11' fill='#52514e'>DRA claim: n_d Neuron devices,</text>
<text x='252' y='268' font-size='11' fill='#52514e'>each paired with its EFA</text>
<text x='252' y='284' font-size='11' fill='#52514e'>TP x CP, KV cache per stream</text>
<text x='252' y='300' font-size='11' fill='#52514e'>rank 0: NIXL agent</text>
<rect x='240' y='320' width='260' height='96' rx='8' fill='#ffffff' stroke='#2a78d6' stroke-width='2'/>
<text x='252' y='342' font-size='13' font-weight='600' fill='#0b0b0b'>DiT replica 3</text>
<text x='252' y='362' font-size='11' fill='#52514e'>DRA claim: n_d Neuron devices,</text>
<text x='252' y='378' font-size='11' fill='#52514e'>each paired with its EFA</text>
<text x='252' y='394' font-size='11' fill='#52514e'>TP x CP, KV cache per stream</text>
<text x='252' y='410' font-size='11' fill='#52514e'>rank 0: NIXL agent</text>
<rect x='610' y='60' width='340' height='400' rx='12' fill='none' stroke='#eb6834' stroke-width='2' stroke-dasharray='5 4'/>
<text x='626' y='84' font-size='13' font-weight='600' fill='#0b0b0b'>Decoder role (VAE): R_v replicas</text>
<rect x='630' y='100' width='300' height='120' rx='8' fill='#ffffff' stroke='#eb6834' stroke-width='2'/>
<text x='642' y='122' font-size='13' font-weight='600' fill='#0b0b0b'>VAE replica 1</text>
<text x='642' y='142' font-size='11' fill='#52514e'>DRA claim: n_v devices (1 chip)</text>
<text x='642' y='158' font-size='11' fill='#52514e'>K sessions: per-session causal cache</text>
<text x='642' y='174' font-size='11' fill='#52514e'>(427 MiB each) + NIXL slot block</text>
<text x='642' y='190' font-size='11' fill='#52514e'>GET /load: sessions served</text>
<text x='642' y='206' font-size='11' fill='#52514e'>one VAE serves ~ T_d / T_v streams</text>
<rect x='630' y='250' width='300' height='120' rx='8' fill='#ffffff' stroke='#eb6834' stroke-width='2'/>
<text x='642' y='272' font-size='13' font-weight='600' fill='#0b0b0b'>VAE replica 2</text>
<text x='642' y='292' font-size='11' fill='#52514e'>DRA claim: n_v devices (1 chip)</text>
<text x='642' y='308' font-size='11' fill='#52514e'>K sessions: per-session causal cache</text>
<text x='642' y='324' font-size='11' fill='#52514e'>(427 MiB each) + NIXL slot block</text>
<text x='642' y='340' font-size='11' fill='#52514e'>GET /load: sessions served</text>
<text x='642' y='356' font-size='11' fill='#52514e'>one VAE serves ~ T_d / T_v streams</text>
<rect x='630' y='382' width='300' height='70' rx='8' fill='#ffffff' stroke='#52514e' stroke-width='2'/>
<text x='642' y='404' font-size='13' font-weight='600' fill='#0b0b0b'>Placement + failover</text>
<text x='642' y='424' font-size='11' fill='#52514e'>least-loaded VAE per session; a failed write:</text>
<text x='642' y='440' font-size='11' fill='#52514e'>set aside, retry on another (~3 s switch)</text>
<line x1='174' y1='245' x2='236' y2='245' stroke='#52514e' stroke-width='2' marker-end='url(#a)'/>
<text x='205.0' y='237.0' font-size='11' text-anchor='middle' fill='#0b0b0b'>session</text>
<line x1='500' y1='160' x2='626' y2='160' stroke='#eb6834' stroke-width='2' marker-end='url(#a)'/>
<text x='563' y='138' font-size='11' text-anchor='middle' fill='#0b0b0b'>NIXL write</text>
<text x='563' y='152' font-size='10' text-anchor='middle' fill='#52514e'>1.1 MB, 0.17 ms</text>
<line x1='500' y1='258' x2='626' y2='300' stroke='#eb6834' stroke-width='2' marker-end='url(#a)'/>
<line x1='500' y1='368' x2='626' y2='320' stroke='#eb6834' stroke-width='2' marker-end='url(#a)'/>
<text x='24' y='480' font-size='11' fill='#52514e'>Each role is sized (n_d, n_v), replicated (R_d, R_v) and placed on its own; rate matching: R_v = ceil(R_d * T_v / T_d).</text>
<text x='24' y='498' font-size='11' fill='#52514e'>Co-located baseline: every chip runs the DiT, then the VAE: T_d(N) + T_v(N) per chunk; split: max(T_d(n_d), T_v(n_v)).</text>
</svg>