<svg xmlns='http://www.w3.org/2000/svg' width='820' height='300' viewBox='0 0 820 300' font-family='Helvetica, Arial, sans-serif'>
<rect width='820' height='300' fill='#fcfcfb'/>
<text x='24' y='28' font-size='16' font-weight='600' fill='#0b0b0b'>Same reaction time, more frames per second (LingBot 480)</text>
<text x='24' y='62' font-size='13' font-weight='600' fill='#0b0b0b'>Time for a key press to show up (median)</text>
<text x='24' y='94' font-size='11' fill='#0b0b0b'>co-located 4 chips</text>
<rect x='24' y='100' width='197.1' height='22' rx='4' fill='#2a78d6'><title>co-located 4 chips: 1114 ms</title></rect>
<text x='229.1' y='116' font-size='12' fill='#0b0b0b'>1114 ms</text>
<text x='24' y='150' font-size='11' fill='#0b0b0b'>split 4 + 1 chips</text>
<rect x='24' y='156' width='216.0' height='22' rx='4' fill='#eb6834'><title>split 4 + 1 chips: 1221 ms</title></rect>
<text x='248.0' y='172' font-size='12' fill='#0b0b0b'>1221 ms</text>
<text x='24' y='206' font-size='11' fill='#0b0b0b'>split 4 + 4 chips</text>
<rect x='24' y='212' width='197.1' height='22' rx='4' fill='#eb6834'><title>split 4 + 4 chips: 1114 ms</title></rect>
<text x='229.1' y='228' font-size='12' fill='#0b0b0b'>1114 ms</text>
<text x='430' y='62' font-size='13' font-weight='600' fill='#0b0b0b'>Frames per second</text>
<text x='430' y='94' font-size='11' fill='#0b0b0b'>co-located 4 chips</text>
<rect x='430' y='100' width='178.2' height='22' rx='4' fill='#2a78d6'><title>co-located 4 chips: 15.5 fps</title></rect>
<text x='616.2' y='116' font-size='12' fill='#0b0b0b'>15.5 fps</text>
<text x='430' y='150' font-size='11' fill='#0b0b0b'>split 4 + 1 chips</text>
<rect x='430' y='156' width='201.2' height='22' rx='4' fill='#eb6834'><title>split 4 + 1 chips: 17.5 fps</title></rect>
<text x='639.2' y='172' font-size='12' fill='#0b0b0b'>17.5 fps</text>
<text x='430' y='206' font-size='11' fill='#0b0b0b'>split 4 + 4 chips</text>
<rect x='430' y='212' width='202.4' height='22' rx='4' fill='#eb6834'><title>split 4 + 4 chips: 17.6 fps</title></rect>
<text x='640.4' y='228' font-size='12' fill='#0b0b0b'>17.6 fps</text>
<text x='24' y='270' font-size='11' fill='#52514e'>Like a car wash with two workers: a car comes out more often (more fps), but each car still</text>
<text x='24' y='286' font-size='11' fill='#52514e'>takes as long to get through (same reaction time). A 1-chip VAE is slow enough to add 107 ms; 4 VAE chips do not.</text>
</svg>