<text x='150' y='106' font-size='12' fill='#0b0b0b'>co-located: a chunk every 449 ms = 26.7 fps</text>
<text x='140' y='157' font-size='12' text-anchor='end' fill='#0b0b0b'>DiT pod, 16 chips</text>
<text x='140' y='191' font-size='12' text-anchor='end' fill='#0b0b0b'>VAE pod, 1 chip</text>
