<text x='150' y='220' font-size='11' fill='#52514e'>375 ms / chunk = 32 fps: the VAE of chunk n overlaps the DiT of chunk n + 1</text>
<text x='24' y='246' font-size='11' fill='#52514e'>Co-located: P = T_d(N) + T_v(N). Disaggregated: P = max(T_d(n_d), T_v(n_v)); the 1.1 MB latent moves over NIXL/EFA in 0.17 ms.</text>
