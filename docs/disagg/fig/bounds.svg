<svg xmlns='http://www.w3.org/2000/svg' width='860' height='420' viewBox='0 0 860 420' font-family='Helvetica, Arial, sans-serif'>
<rect width='860' height='420' fill='#fcfcfb'/>
<text x='24' y='28' font-size='16' font-weight='600' fill='#0b0b0b'>What bounds each stage: % of time each engine is busy</text>
<text x='24' y='46' font-size='12' fill='#52514e'>LingBot 720p split run, hottest graph of each stage (DiT: two transformer blocks; VAE: a fused conv)</text>
<text x='200' y='87' font-size='12' text-anchor='end' fill='#0b0b0b'>Tensor (matmul)</text>
<rect x='210' y='70' width='239.4' height='13' rx='3' fill='#2a78d6'><title>DiT Tensor (matmul): 57%</title></rect>
<text x='455.4' y='81' font-size='11' fill='#0b0b0b'>DiT 57%</text>
<rect x='210' y='85' width='394.8' height='13' rx='3' fill='#eb6834'><title>VAE Tensor (matmul): 94%</title></rect>
<text x='610.8' y='96' font-size='11' fill='#0b0b0b'>VAE 94%</text>
<text x='200' y='137' font-size='12' text-anchor='end' fill='#0b0b0b'>Scalar (exp, activations)</text>
<rect x='210' y='120' width='226.8' height='13' rx='3' fill='#2a78d6'><title>DiT Scalar (exp, activations): 54%</title></rect>
<text x='442.8' y='131' font-size='11' fill='#0b0b0b'>DiT 54%</text>
<rect x='210' y='135' width='205.8' height='13' rx='3' fill='#eb6834'><title>VAE Scalar (exp, activations): 49%</title></rect>
<text x='421.8' y='146' font-size='11' fill='#0b0b0b'>VAE 49%</text>
<text x='200' y='187' font-size='12' text-anchor='end' fill='#0b0b0b'>Vector (max, sums, casts)</text>
<rect x='210' y='170' width='147.0' height='13' rx='3' fill='#2a78d6'><title>DiT Vector (max, sums, casts): 35%</title></rect>
<text x='363.0' y='181' font-size='11' fill='#0b0b0b'>DiT 35%</text>
<rect x='210' y='185' width='105.0' height='13' rx='3' fill='#eb6834'><title>VAE Vector (max, sums, casts): 25%</title></rect>
<text x='321.0' y='196' font-size='11' fill='#0b0b0b'>VAE 25%</text>
<text x='200' y='237' font-size='12' text-anchor='end' fill='#0b0b0b'>GpSimd (DMA setup, misc)</text>
<rect x='210' y='220' width='100.8' height='13' rx='3' fill='#2a78d6'><title>DiT GpSimd (DMA setup, misc): 24%</title></rect>
<text x='316.8' y='231' font-size='11' fill='#0b0b0b'>DiT 24%</text>
<rect x='210' y='235' width='79.8' height='13' rx='3' fill='#eb6834'><title>VAE GpSimd (DMA setup, misc): 19%</title></rect>
<text x='295.8' y='246' font-size='11' fill='#0b0b0b'>VAE 19%</text>
<text x='200' y='287' font-size='12' text-anchor='end' fill='#0b0b0b'>DMA (data movement)</text>
<rect x='210' y='270' width='336.0' height='13' rx='3' fill='#2a78d6'><title>DiT DMA (data movement): 80%</title></rect>
<text x='552.0' y='281' font-size='11' fill='#0b0b0b'>DiT 80%</text>
<rect x='210' y='285' width='172.2' height='13' rx='3' fill='#eb6834'><title>VAE DMA (data movement): 41%</title></rect>
<text x='388.2' y='296' font-size='11' fill='#0b0b0b'>VAE 41%</text>
<line x1='24' x2='836' y1='312' y2='312' stroke='#e4e3df'/>
<text x='200' y='337' font-size='12' text-anchor='end' fill='#0b0b0b'>all engines idle</text>
<rect x='210' y='320' width='79.8' height='13' rx='3' fill='#2a78d6'><title>DiT all engines idle: 19%</title></rect>
<text x='295.8' y='331' font-size='11' fill='#0b0b0b'>DiT 19%</text>
<rect x='210' y='335' width='8.4' height='13' rx='3' fill='#eb6834'><title>VAE all engines idle: 2%</title></rect>
<text x='224.4' y='346' font-size='11' fill='#0b0b0b'>VAE 2%</text>
<line x1='630.0' x2='630.0' y1='62' y2='356' stroke='#52514e' stroke-dasharray='3 3'/>
<text x='626.0' y='60' font-size='10' text-anchor='end' fill='#52514e'>100%</text>
<text x='24' y='390' font-size='12' fill='#0b0b0b'>VAE: compute-bound. The matmul engine is busy 94% of the time; nothing waits.</text>
<text x='24' y='408' font-size='12' fill='#0b0b0b'>DiT: no engine is saturated. DMA is the closest (80%), the matmul engine 57%, and everything waits 19%: data movement, not math.</text>
</svg>