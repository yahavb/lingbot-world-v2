<svg xmlns='http://www.w3.org/2000/svg' width='820' height='330' viewBox='0 0 820 330' font-family='Helvetica, Arial, sans-serif'>
<rect width='820' height='330' fill='#fcfcfb'/>
<text x='24' y='28' font-size='16' font-weight='600' fill='#0b0b0b'>Two stages, two usage profiles (LingBot 720p, 16-chip DiT + 2-chip VAE, measured)</text>
<text x='20' y='64' font-size='12' font-weight='600' fill='#0b0b0b'>Matmul engine busy</text>
<text x='20' y='80' font-size='10' fill='#52514e'>% of time</text>
<rect x='44' y='178.8' width='52' height='91.2' rx='4' fill='#2a78d6'><title>DiT Matmul engine busy: 57%</title></rect>
<text x='70' y='172.8' font-size='12' text-anchor='middle' fill='#0b0b0b'>57%</text>
<text x='70' y='286' font-size='11' text-anchor='middle' fill='#0b0b0b'>DiT</text>
<rect x='116' y='119.6' width='52' height='150.4' rx='4' fill='#eb6834'><title>VAE Matmul engine busy: 94%</title></rect>
<text x='142' y='113.6' font-size='12' text-anchor='middle' fill='#0b0b0b'>94%</text>
<text x='142' y='286' font-size='11' text-anchor='middle' fill='#0b0b0b'>VAE</text>
<line x1='34' x2='192' y1='270' y2='270' stroke='#52514e'/>
<text x='214' y='64' font-size='12' font-weight='600' fill='#0b0b0b'>Data movement busy</text>
<text x='214' y='80' font-size='10' fill='#52514e'>% of time, overlaps compute</text>
<rect x='238' y='142.0' width='52' height='128.0' rx='4' fill='#2a78d6'><title>DiT Data movement busy: 80%</title></rect>
<text x='264' y='136.0' font-size='12' text-anchor='middle' fill='#0b0b0b'>80%</text>
<text x='264' y='286' font-size='11' text-anchor='middle' fill='#0b0b0b'>DiT</text>
<rect x='310' y='204.4' width='52' height='65.6' rx='4' fill='#eb6834'><title>VAE Data movement busy: 41%</title></rect>
<text x='336' y='198.4' font-size='12' text-anchor='middle' fill='#0b0b0b'>41%</text>
<text x='336' y='286' font-size='11' text-anchor='middle' fill='#0b0b0b'>VAE</text>
<line x1='228' x2='386' y1='270' y2='270' stroke='#52514e'/>
<text x='408' y='64' font-size='12' font-weight='600' fill='#0b0b0b'>All engines idle</text>
<text x='408' y='80' font-size='10' fill='#52514e'>% of time (waiting)</text>
<rect x='432' y='239.6' width='52' height='30.4' rx='4' fill='#2a78d6'><title>DiT All engines idle: 19%</title></rect>
<text x='458' y='233.6' font-size='12' text-anchor='middle' fill='#0b0b0b'>19%</text>
<text x='458' y='286' font-size='11' text-anchor='middle' fill='#0b0b0b'>DiT</text>
<rect x='504' y='266.8' width='52' height='3.2' rx='4' fill='#eb6834'><title>VAE All engines idle: 2%</title></rect>
<text x='530' y='260.8' font-size='12' text-anchor='middle' fill='#0b0b0b'>2%</text>
<text x='530' y='286' font-size='11' text-anchor='middle' fill='#0b0b0b'>VAE</text>
<line x1='422' x2='580' y1='270' y2='270' stroke='#52514e'/>
<text x='602' y='64' font-size='12' font-weight='600' fill='#0b0b0b'>Device memory per rank</text>
<text x='602' y='80' font-size='10' fill='#52514e'>GiB (DiT: weights + KV)</text>
<rect x='626' y='133.6' width='52' height='136.4' rx='4' fill='#2a78d6'><title>DiT Device memory per rank: 17.1</title></rect>
<text x='652' y='127.6' font-size='12' text-anchor='middle' fill='#0b0b0b'>17.1</text>
<text x='652' y='286' font-size='11' text-anchor='middle' fill='#0b0b0b'>DiT</text>
<rect x='698' y='246.0' width='52' height='24.0' rx='4' fill='#eb6834'><title>VAE Device memory per rank: 3.0</title></rect>
<text x='724' y='240.0' font-size='12' text-anchor='middle' fill='#0b0b0b'>3.0</text>
<text x='724' y='286' font-size='11' text-anchor='middle' fill='#0b0b0b'>VAE</text>
<line x1='616' x2='774' y1='270' y2='270' stroke='#52514e'/>
<text x='24' y='312' font-size='11' fill='#52514e'>The DiT moves data and waits (idle 19%); the VAE keeps its matmul engine busy (94%). Different needs, so they get different chips.</text>
</svg>