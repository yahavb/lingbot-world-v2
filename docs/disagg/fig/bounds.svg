<svg xmlns='http://www.w3.org/2000/svg' width='760' height='270' viewBox='0 0 760 270' font-family='Helvetica, Arial, sans-serif'>
<rect width='760' height='270' fill='#fcfcfb'/>
<text x='24' y='26' font-size='15' font-weight='600' fill='#0b0b0b'>What each stage spends its time on (ms per call, 4-chip, 480x768)</text>
<text x='150' y='78' font-size='12' text-anchor='end' fill='#0b0b0b'>DiT attention block</text>
<rect x='160' y='56' width='142.4' height='32' rx='4' fill='#2a78d6'><title>useful math 1.84 ms</title></rect>
<text x='166' y='77' font-size='11' fill='#ffffff'>math 1.84</text>
<rect x='304.4' y='56' width='354.2' height='32' rx='4' fill='#eb6834'><title>headroom 4.54 ms</title></rect>
<text x='310.4' y='77' font-size='11' fill='#ffffff'>headroom 4.5</text>
<text x='666.6' y='77' font-size='11' fill='#0b0b0b'>= 6.38 ms</text>
<text x='160' y='104' font-size='11' fill='#52514e'>headroom filled by moving data inside the chip (DMA busy 82%)</text>
<text x='150' y='148' font-size='12' text-anchor='end' fill='#0b0b0b'>VAE convolution</text>
<rect x='160' y='126' width='196.5' height='32' rx='4' fill='#2a78d6'><title>useful math 2.53 ms</title></rect>
<text x='166' y='147' font-size='11' fill='#ffffff'>math 2.53</text>
<rect x='358.5' y='126' width='247.5' height='32' rx='4' fill='#eb6834'><title>headroom 3.18 ms</title></rect>
<text x='364.5' y='147' font-size='11' fill='#ffffff'>headroom 3.2</text>
<text x='614.0' y='147' font-size='11' fill='#0b0b0b'>= 5.71 ms</text>
<text x='160' y='174' font-size='11' fill='#52514e'>headroom filled by a half-empty math engine (busy ~90%, ~45% of peak)</text>
<text x='24' y='226' font-size='11' fill='#52514e'>Blue: the math at full speed. Orange: headroom, the time a better kernel could reclaim.</text>
<text x='24' y='242' font-size='11' fill='#52514e'>Each stage's headroom has a different cause, so they scale differently with chips (the cause).</text>
<text x='24' y='258' font-size='11' fill='#52514e'>Disaggregation does not change it (that is kernel work); Figure chiptime shows what disaggregation saves.</text>
</svg>