<text x='170' y='186' font-size='11' fill='#52514e'>9 chunks in 6.2 s: a chunk (12 frames) every 682 ms = 1056 frames per minute</text>
<text x='24' y='256' font-size='12' fill='#0b0b0b'>Each key press still takes about 1.1 s to show up in both (1114 ms median).</text>
<text x='24' y='274' font-size='11' fill='#52514e'>Two workers: one washes the next car while the other dries this one. More cars per hour; each car takes as long.</text>
<text x='24' y='290' font-size='11' fill='#52514e'>Split = 4 DiT chips + 4 VAE chips (17.6 fps); co-located = 4 chips (15.5 fps).</text>
