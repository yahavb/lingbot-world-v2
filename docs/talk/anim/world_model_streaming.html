<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World model streaming</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:pointer}
  svg{display:block;width:100vw;height:100vh}
  text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:800;fill:#fff}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Text feeds T5. Before each chunk the latest action (forward, up, down, forward, hold) lights up and goes into the DiT. The DiT makes the chunk, reading a KV cache that keeps a sink chunk and rolls the oldest out; each cache slot keeps the colour of the action it was made with. Before the fourth chunk a new prompt goes through T5 again, while the KV cache is kept. Each chunk streams to the VAE and becomes frames whose camera follows the action, while the DiT works on the next chunk.">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#0b0d12"/>
  <g id="static"></g>
  <g id="dyn"></g>
</svg>
<script>
(function(){
  "use strict";
  var LOOP = 24;                       // seconds per loop
  // one action per chunk (the latest /control when the chunk starts); a chunk takes its action's colour
  var ACT  = ["W", "\u2191", "\u2193", "W", "\u25A0"];      // forward, up, down, forward, hold
  var ACOL = {"W":"#3d9bff", "\u2191":"#ff7a3d", "\u2193":"#2fd39a", "\u25A0":"#c9d1e0"};
  var KEYS = ["W", "\u2191", "\u2193", "\u25A0"];
  var C = ACT.map(function(a){ return ACOL[a]; });
  var NEWP = 3;                         // a new prompt arrives before this chunk
  var N = 5, FPC = 3, CAP = 4;          // chunks, frames per chunk, cache slots
  var GRAY = "#5f6880";

  // ---- timing (seconds) ----
  var S0 = 3, PITCH = 3, DIT = 2.4, TRAVEL = 0.8, VAE = 1.5, FGAP = 0.25, FLY = 0.6;
  function sC(c){ return S0 + c*PITCH; }        // DiT start for chunk c
  function eC(c){ return sC(c) + DIT; }         // DiT done, chunk emitted, cache grows
  function aC(c){ return eC(c) + TRAVEL; }      // chunk arrives at VAE
  function fK(c,j){ return aC(c) + VAE + j*FGAP; } // frame j of chunk c leaves VAE

  // camera per output frame: up/down move the horizon, forward zooms, hold freezes
  var CAM = [], pitch = 0, zoom = 0;
  for (var ci=0; ci<5; ci++) for (var fj=0; fj<3; fj++){
    var a = ACT[ci];
    if (a==="W") zoom += 0.12; else if (a==="\u2191") pitch += 9; else if (a==="\u2193") pitch -= 9;
    CAM.push({pitch:pitch, zoom:zoom, snow: ci>=NEWP});
  }

  // ---- helpers ----
  function clamp(x){ return x<0?0:x>1?1:x; }
  function prog(t,a,d){ return clamp((t-a)/d); }
  function ease(p){ return p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; }
  function lerp(a,b,p){ return a+(b-a)*p; }
  function hexA(h,a){ var n=parseInt(h.slice(1),16);
    return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")"; }
  function R(x,y,w,h,rx,fill,stroke,sw,extra){
    return '<rect x="'+x+'" y="'+y+'" width="'+Math.max(0,w)+'" height="'+Math.max(0,h)+'" rx="'+rx+
      '" fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width="'+sw+'"':'')+(extra||'')+'/>'; }
  function T(x,y,s,txt,fill){ return '<text x="'+x+'" y="'+y+'" font-size="'+s+'" text-anchor="middle"'+
      (fill?' style="fill:'+fill+'"':'')+'>'+txt+'</text>'; }
  // thick horizontal / vertical arrow
  function arrowH(x1,x2,y,col){ return R(x1,y-7,x2-x1-26,14,7,col)+
      '<polygon points="'+(x2-30)+','+(y-22)+' '+x2+','+y+' '+(x2-30)+','+(y+22)+'" fill="'+col+'"/>'; }
  function arrowV(x,y1,y2,col){ // y2 is the tip; works both up and down
    var d = y2>y1 ? 1 : -1, base = y2 - d*30;
    return R(x-7,Math.min(y1,base),14,Math.abs(base-y1),7,col)+
      '<polygon points="'+(x-22)+','+base+' '+x+','+y2+' '+(x+22)+','+base+'" fill="'+col+'"/>'; }

  // ---- geometry ----
  var DOC = {x:50,y:150,w:150,h:150};
  var T5  = {x:280,y:150,w:200,h:150};
  var DT  = {x:590,y:90,w:360,h:220};
  var KV  = {x:590,y:390,w:360,h:80};
  var VA  = {x:1180,y:110,w:240,h:180};
  var FS  = {x:70,y:595,w:1460,h:210};
  var KP  = {x:270,y:400,w:220,h:62};       // action keys, under T5
  var FW = 88, FH = 140, FY = 630, FX0 = 80, FP = 96;
  var SLOT = (KV.w - 24 - (CAP-1)*8)/CAP;

  // ---- static layer ----
  var st = '';
  st += arrowH(210,272,225,GRAY);                 // text -> T5
  st += arrowH(488,582,225,GRAY);                 // T5 -> DiT
  st += arrowH(962,1172,200,GRAY);                // DiT -> VAE
  st += arrowV(770,385,318,GRAY);                 // KV cache -> DiT (read)
  st += arrowV(1300,298,588,GRAY);                // VAE -> frames
  st += '<line x1="495" y1="420" x2="566" y2="322" stroke="'+GRAY+'" stroke-width="14" stroke-linecap="round"/>'+
        '<polygon points="556,300 592,286 584,324" fill="'+GRAY+'"/>';   // keys -> DiT
  st += T(1067,300,44,'chunk');
  st += T(770,535,44,'KV cache');
  // filmstrip
  st += R(FS.x,FS.y,FS.w,FS.h,12,'#1b1f29');
  for (var sx = FS.x+14; sx < FS.x+FS.w-24; sx += 48){
    st += R(sx,FS.y+8,24,14,4,'#6b7489') + R(sx,FS.y+FS.h-22,24,14,4,'#6b7489');
  }
  for (var k=0;k<N*FPC;k++) st += R(FX0+k*FP,FY,FW,FH,8,'#0b0d12');
  st += T(800,875,44,'frames');
  document.getElementById('static').innerHTML = st;

  // ---- dynamic pieces ----
  function box(b,col,active,label,fs){
    var s = R(b.x,b.y,b.w,b.h,22, active?hexA(col,.30):'#151a25', col, active?10:6,
              active?' filter="url(#glow)"':' opacity="0.75"');
    return s + T(b.x+b.w/2, b.y+b.h/2 + fs*0.18 - (b===DT||b===VA?22:0), fs, label);
  }
  function bar(x,y,w,h,p,col){ return R(x,y,w,h,h/2,'#0b0d12','#3a4256',4) + (p>0?R(x,y,w*p,h,h/2,col):''); }
  function token(cx,cy,col,sc,op){ // a stack of 3 latent frames
    var s='', z=56*sc;
    for (var m=2;m>=0;m--) s += R(cx-z/2+m*10*sc, cy-z/2-m*10*sc, z, z, 8*sc, col, '#0b0d12', 4,
                                 ' opacity="'+op+'"');
    return s;
  }
  function frame(x,y,w,h,k,col,op){
    var cam = CAM[k], sc = h/FH, z = 1+cam.zoom, py = cam.pitch*sc;
    var sunX = x + w*0.5 + (k/(N*FPC-1)-0.5)*w*0.3;   // one consistent scene
    var s = '<g opacity="'+op+'">'+R(x,y,w,h,8,hexA(col,.22),col,6)+
      '<clipPath id="fc'+k+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8"/></clipPath>'+
      '<g clip-path="url(#fc'+k+')">'+
      '<circle cx="'+sunX+'" cy="'+(y+h*0.28+py)+'" r="'+(w*0.15*z)+'" fill="#fff4b8"/>'+
      '<ellipse cx="'+(x+w*0.5)+'" cy="'+(y+h-h*0.24+py)+'" rx="'+(w*0.36*z)+'" ry="'+(h*0.17*z)+'" fill="'+col+'"/>';
    if (cam.snow) for (var i=0;i<5;i++)          // the new prompt's event appears in the scene
      s += '<circle cx="'+(x+w*(0.15+0.17*i))+'" cy="'+(y+h*(0.15+0.12*(i%3)))+'" r="'+(4*sc)+'" fill="#ffffff"/>';
    return s+'</g></g>';
  }
  function dot(x,y,r,col){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(col||'#fff')+'" filter="url(#glow)"/>'; }

  function render(t){
    var s = '';
    // --- text block, fed to T5 once ---
    var tP = sC(NEWP) - 2.4;                     // the new prompt arrives
    var swap = ease(prog(t,tP,0.5)), lc = swap>0.5 ? '#ffcc33' : '#e8ecf4';
    var dOp = ease(prog(t,0,0.6)) * (swap>0 && swap<1 ? Math.abs(1-2*swap) : 1);
    s += '<g opacity="'+dOp+'">'+R(DOC.x,DOC.y,DOC.w,DOC.h,16,'#1e2533',lc,6);
    (swap>0.5 ? [90,110,60,100] : [110,90,110,70]).forEach(function(w,i){ s += R(DOC.x+20,DOC.y+28+i*28,w,14,7,lc); });
    s += '</g>';
    var p1 = prog(t,0.6,0.8); if (p1>0 && p1<1) s += dot(lerp(205,275,ease(p1)),225,18);
    var q1 = prog(t,tP+0.5,0.6); if (q1>0 && q1<1) s += dot(lerp(205,275,ease(q1)),225,18,'#ffcc33');
    var t5on = (t>=1.4 && t<2.6) || (t>=tP+1.1 && t<tP+1.9);
    s += box(T5,'#2fd3c9',t5on,'T5',64);
    var p2 = prog(t,2.2,0.8); if (p2>0 && p2<1) s += dot(lerp(485,585,ease(p2)),225,18,'#7ff5ec');
    var q2 = prog(t,tP+1.7,0.6); if (q2>0 && q2<1) s += dot(lerp(485,585,ease(q2)),225,18,'#ffcc33');

    // --- action keys: the latest action goes into the DiT just before each chunk ---
    var on = -1;
    for (var c0=0;c0<N;c0++) if (t>=sC(c0)-0.7 && t<sC(c0)+0.3) on = c0;
    KEYS.forEach(function(k,i){
      var lit = on>=0 && ACT[on]===k, kx = KP.x+i*56;
      s += R(kx,KP.y,48,KP.h,10, lit?ACOL[k]:'#151a25', lit?'#ffffff':'#8fa3c7', lit?6:4, lit?' filter="url(#glow)"':'') +
           T(kx+24,KP.y+44,34,k,lit?'#0b0d12':null);
    });
    for (c0=0;c0<N;c0++){ var pa = prog(t,sC(c0)-0.5,0.5);
      if (pa>0 && pa<1) s += dot(lerp(500,575,ease(pa)), lerp(415,315,ease(pa)), 16, C[c0]); }

    // --- DiT ---
    var cur = -1, dp = 0;
    for (var c=0;c<N;c++) if (t>=sC(c) && t<eC(c)){ cur=c; dp=(t-sC(c))/DIT; }
    s += box(DT, cur>=0?C[cur]:'#8fa3c7', cur>=0, 'DiT', 76);
    s += bar(DT.x+40, DT.y+DT.h-62, DT.w-80, 34, cur>=0?dp:0, cur>=0?C[cur]:'#000');

    // --- KV cache: grows each chunk; chunk 0 is a pinned sink, oldest other entry rolls out ---
    var reading = cur>=1;
    s += R(KV.x,KV.y,KV.w,KV.h,14,'#0f141e', reading?'#ffffff':'#8fa3c7', reading?8:6, reading?' filter="url(#glow)"':'');
    var cx = KV.x+12;
    for (c=0;c<N;c++){
      var a = ease(prog(t,eC(c),0.5));
      var ev = 0; if (c>=1 && c+CAP<=N) ev = ease(prog(t,eC(c+CAP-1),0.5)); // chunk 1 evicted when chunk 4 lands
      var f = a*(1-ev);
      // the evicted chunk drops out of the cache, so the roll is visible
      if (ev > 0 && ev < 1) s += '<g opacity="'+(1-ev)+'">' + R(cx, KV.y+12 - 70*ev, SLOT*0.8, KV.h-24, 8, C[c], null, 0) + '</g>' +
                               '<g opacity="'+(1-ev)+'">' + T(cx + SLOT*0.4 - 60, KV.y - 44, 20, 'rolls out', '#ff9f43') + '</g>';
      if (f>0.001) s += R(cx, KV.y+12, SLOT*f, KV.h-24, 8, C[c], c===0?'#ffffff':null, 5);
      cx += (SLOT+8)*f;
    }
    // labels: the first slot is the pinned sink, the rest is a rolling window
    var lab = ease(prog(t, eC(0), 0.5)), lab2 = ease(prog(t, eC(1), 0.5));
    s += '<g opacity="'+lab+'">' + T(KV.x+12+SLOT/2, KV.y-12, 20, 'sink', '#ffffff') + '</g>' +
         '<g opacity="'+lab2+'">' + T(KV.x+300, KV.y-12, 20, 'rolling window', '#aab3c5') + '</g>';
    if (reading){ var ph = ((t-sC(cur))/0.55)%1; s += dot(770, lerp(380,322,ph), 15); }

    // --- chunk tokens travelling DiT -> VAE ---
    for (c=0;c<N;c++){
      var tp = prog(t,eC(c),TRAVEL);
      if (tp>0 && tp<1) s += token(lerp(990,1150,ease(tp)), 196, C[c], 1, tp>0.85?(1-tp)/0.15:1);
    }

    // --- VAE ---
    var vc = -1, vp = 0;
    for (c=0;c<N;c++) if (t>=aC(c) && t<fK(c,FPC-1)+0.2){ vc=c; vp=clamp((t-aC(c))/VAE); }
    s += box(VA, vc>=0?C[vc]:'#8fa3c7', vc>=0, 'VAE', 64);
    s += bar(VA.x+30, VA.y+VA.h-58, VA.w-60, 30, vc>=0?vp:0, vc>=0?C[vc]:'#000');

    // --- frames fly from VAE to the filmstrip ---
    for (c=0;c<N;c++) for (var j=0;j<FPC;j++){
      var k = c*FPC+j, fp = prog(t,fK(c,j),FLY);
      if (fp<=0) continue;
      var e = ease(fp), sc = lerp(0.45,1,e);
      var x = lerp(1300-FW*sc/2, FX0+k*FP, e), y = lerp(300, FY, e);
      s += frame(x, y, FW*sc, FH*sc, k, C[c], 1);
    }
    document.getElementById('dyn').innerHTML = s;
  }

  // ---- loop / restart / reduced motion ----
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hm = /t=([\d.]+)/.exec(location.hash);       // e.g. #t=8 freezes at 8 s (for checking)
  var END_T = LOOP - 0.01;
  if (hm){ render(parseFloat(hm[1])); return; }
  if (reduce){ render(END_T); return; }
  // plays once, only after a click (or Space); holds the last frame; another click replays it
  var t0 = 0, running = false;
  function tick(now){ var t = Math.max(0, (now - t0)/1000);
    if (t >= END_T){ render(END_T); running = false; return; }
    render(t); requestAnimationFrame(tick); }
  function start(){ t0 = performance.now(); if (!running){ running = true; requestAnimationFrame(tick); } }
  render(0);
  document.addEventListener('click', start);
  document.addEventListener('keydown', function(ev){ if (ev.code==='Space'){ ev.preventDefault(); start(); } });
})();
</script>
</body>
</html>
