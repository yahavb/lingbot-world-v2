<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copy the memory first, or read it in place</title>
<style>
  html,body{margin:0;height:100%;background:#141416;overflow:hidden}
  svg{display:block;width:100vw;height:100vh}
  text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:650;fill:#fff}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1600 560" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Two lanes, the same memory of three chunks in each, running at the same time. Top, copy first: all chunks are copied into one new buffer padded with zeros, then one call computes the answer; 7.37 seconds per video. Bottom, read in place: each chunk is computed where it is into a small note, the notes are merged exactly; 4.34 seconds. Then two chunks per call: 4.08 seconds. Measured on 8 trn3 chips.">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fab219"/></marker>
  </defs>
  <rect width="1600" height="560" fill="#141416"/>
  <g id="dyn"></g>
</svg>
<script>
(function(){
  "use strict";
  function clamp(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
  function prog(t, a, d){ return clamp((t - a) / d); }
  function ease(p){ return p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
  function rgba(h, a){ var n = parseInt(h.slice(1), 16);
    return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")"; }
  function R(x, y, w, h, rx, fill, stroke, sw, extra){
    return '<rect x="' + x + '" y="' + y + '" width="' + Math.max(0, w) + '" height="' + Math.max(0, h) + '" rx="' + rx +
      '" fill="' + fill + '"' + (stroke ? ' stroke="' + stroke + '" stroke-width="' + sw + '"' : '') + (extra || '') + '/>'; }
  function T(x, y, size, txt, fill, op, anchor){
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" text-anchor="' + (anchor || 'start') + '" style="fill:' +
      fill + '"' + (op != null ? ' opacity="' + op + '"' : '') + '>' + txt + '</text>'; }
  function arrow(x1, y1, x2, y2, op){
    if (op <= 0) return "";
    return '<path d="M' + x1 + ',' + y1 + ' L' + x2 + ',' + y2 + '" stroke="#fab219" stroke-width="4" fill="none" marker-end="url(#ah)" opacity="' + op + '"/>'; }
  var YEL = "#fab219", RED = "#e5484d", GRN = "#3fbf3f", INK2 = "#c3c2b7", GRY = "#5a5955";
  var COL = ["#3987e5", "#d95926", "#199e70"];
  var FAC = [0.37, 1, 0.17];

  // geometry: two lanes drawn the same way
  var LANE = [36, 304];                      // lane tops
  var CX = [250, 480, 710], CWD = 210;       // memory chunks (x, width)
  function cell(c, j){ return CX[c] + 13 + j * 48; }      // 40-wide key cells
  var MEM = 34, MH = 52;                     // memory row, relative to the lane top
  var ROW2 = 120, R2H = 46;                  // buffer (old) / notes (new) row
  var ANS = 1230, AW = 150;                  // the answer box
  var BAR = 196, PXS = 150;                  // time bar row; pixels per measured second
  function bufX(i){ return 250 + i * 42; }   // 16 buffer cells: 12 keys + 4 zeros

  // clock: the bars grow at the same rate in both lanes, so the faster lane finishes first
  var T0 = 0.6, RATE = 260;                  // px per animation second
  var OLD_COPY = 3.03 * PXS, OLD_ALL = 7.37 * PXS, NEW_ALL = 4.34 * PXS, NEW_PAIR = 4.08 * PXS;
  var tCopyEnd = T0 + OLD_COPY / RATE, tOldEnd = T0 + OLD_ALL / RATE, tNewEnd = T0 + NEW_ALL / RATE;
  var tPair = tOldEnd + 1.2, END = tPair + 3.2;

  function memory(top, op){
    var s = "";
    for (var c = 0; c < 3; c++){
      s += R(CX[c], top + MEM, CWD, MH, 12, rgba(COL[c], .10), COL[c], 2, ' opacity="' + op + '"');
      for (var j = 0; j < 4; j++) s += R(cell(c, j), top + MEM + 8, 40, MH - 16, 6, rgba(COL[c], .45), COL[c], 2, ' opacity="' + op + '"');
      s += T(CX[c] + CWD / 2, top + MEM - 14, 18, "chunk " + (c + 1), COL[c], op, "middle");
    }
    return s;
  }
  function timebar(top, w, segs, label, labelCol, op){
    var s = "", x = 250;
    s += T(236, top + BAR + 24, 18, "time", INK2, op, "end");
    for (var i = 0; i < segs.length; i++){
      var sw = Math.min(segs[i][0], Math.max(0, w - (x - 250)));
      if (sw <= 0) break;
      s += R(x, top + BAR, sw, 34, 6, segs[i][1], null, 0, ' opacity="' + op + '"');
      if (segs[i][2] && sw > 170) s += T(x + 12, top + BAR + 24, 18, segs[i][2], "#fff", op, "start");
      x += sw;
    }
    if (label) s += T(x + 14, top + BAR + 26, 26, label, labelCol, op, "start");
    return s;
  }

  function render(t){
    var s = "", c, j, i, fin = ease(prog(t, 0, 0.5));

    s += T(250, 20, 20, "the boxes are the model’s memory (KV cache): what it saw in the earlier chunks", INK2, fin, "start");

    // ═══ lane 1: copy first ═══
    var L = LANE[0];
    s += T(30, L + 64, 30, "copy first", RED, fin, "start");
    s += T(30, L + 94, 18, "(the old way)", INK2, fin, "start");
    s += memory(L, fin);
    s += R(242, L + ROW2 - 6, 16 * 42 + 6, R2H + 12, 10, "rgba(255,255,255,.03)", "rgba(255,255,255,.22)", 2, ' opacity="' + fin + '"');
    for (c = 0; c < 3; c++) for (j = 0; j < 4; j++){
      var k = c * 4 + j, p = ease(prog(t, T0 + k * (tCopyEnd - T0 - 0.5) / 12, 0.45));
      if (p <= 0) continue;
      var x = cell(c, j) + (bufX(k) - cell(c, j)) * p, y = (L + MEM + 8) + (ROW2 - MEM - 8) * p;
      s += R(x, y, 36 + 4 * (1 - p), R2H - 2 - 8 * (1 - p), 6, rgba(COL[c], .5), COL[c], 2);
    }
    var zp = ease(prog(t, tCopyEnd - 0.5, 0.4));
    for (i = 12; i < 16 && zp > 0; i++){
      s += R(bufX(i), L + ROW2, 36, R2H - 2, 6, "rgba(229,72,77," + (.12 * zp) + ")", RED, 2);
      s += T(bufX(i) + 18, L + ROW2 + 31, 22, "0", RED, zp, "middle");
    }
    var oc = ease(prog(t, tCopyEnd, 0.3)) * (1 - ease(prog(t, tOldEnd, 0.4)));
    s += arrow(940, L + ROW2 + R2H / 2, ANS - 12, L + MEM + MH / 2 + 6, oc);
    s += T(950, L + ROW2 + 42, 20, "a new copy, with zeros, before every call", RED, ease(prog(t, T0 + 0.6, 0.4)), "start");
    var oa = ease(prog(t, tOldEnd - 0.2, 0.4));
    s += R(ANS, L + MEM, AW, MH, 12, "rgba(255,255,255," + (.04 + .08 * oa) + ")", oa > 0 ? "#fff" : GRY, 2, ' opacity="' + fin + '"');
    s += T(ANS + AW / 2, L + MEM + 34, 22, "answer", oa > 0 ? "#fff" : GRY, fin, "middle");
    if (oa > 0) s += T(ANS + AW / 2, L + MEM + MH + 26, 18, "error vs fp32 0.032", RED, oa, "middle");
    var ow = (t - T0) * RATE;
    s += timebar(L, ow, [[OLD_COPY, "rgba(229,72,77,.75)", "copying + zeros"], [OLD_ALL - OLD_COPY, "#55544f", "computing"]],
                 ow >= OLD_ALL ? "7.37 s per video" : null, RED, fin);

    // divider
    s += '<line x1="30" y1="' + (LANE[1] - 18) + '" x2="1570" y2="' + (LANE[1] - 18) + '" stroke="#2c2c2a" stroke-width="2" opacity="' + fin + '"/>';

    // ═══ lane 2: read in place ═══
    L = LANE[1];
    s += T(30, L + 64, 30, "read in place", GRN, fin, "start");
    s += T(30, L + 94, 18, "(the fix)", INK2, fin, "start");
    var pair = ease(prog(t, tPair, 0.8));
    s += memory(L, fin);
    for (c = 0; c < 3; c++){
      var on = ease(prog(t, T0 + c * 0.55, 0.3));
      if (on <= 0) continue;
      var bx = CX[c] - 6, bw = CWD + 12;
      if (c < 2 && pair > 0){ var lx = CX[0] - 6, lw = CX[1] + CWD + 6 - lx; bx += (lx - bx) * pair; bw += (lw - bw) * pair; }
      if (!(c === 1 && pair > 0.98))
        s += R(bx, L + MEM - 6, bw, MH + 12, 14, "none", YEL, 3, ' stroke-dasharray="12 9" opacity="' + on + '"');
      var ar = on * (1 - ease(prog(t, tNewEnd - 0.9, 0.3)));
      s += arrow(CX[c] + CWD / 2, L + MEM + MH + 8, CX[c] + CWD / 2, L + ROW2 - 8, ar);
    }
    s += T(1060, L + MEM + 34, 22, (pair > 0.5 ? "2" : "3") + " calls", YEL, ease(prog(t, T0, 0.3)), "middle");
    var sh = ease(prog(t, tNewEnd - 1.5, 0.5)), mg = ease(prog(t, tNewEnd - 0.9, 0.7));
    for (c = 0; c < 3; c++){
      var ap = ease(prog(t, T0 + 0.3 + c * 0.55, 0.4));
      if (ap <= 0) continue;
      var nw = 120 * (1 + (FAC[c] - 1) * sh);
      var nx = CX[c] + CWD / 2 - nw / 2, ny = L + ROW2;
      var tx = ANS + (AW - nw * 0.85) / 2, ty = L + MEM + 8 + c * 13;
      var x2 = nx + (tx - nx) * mg, y2 = ny + (ty - ny) * mg, h2 = (R2H - 2) * (1 - 0.75 * mg);
      s += R(x2, y2, nw * (1 - 0.15 * mg), h2, 6, rgba(COL[c], .85), null, 0, ' opacity="' + ap * (1 - prog(t, tNewEnd, 0.3)) + '"');
      var fo = sh * (1 - mg);
      if (fo > 0) s += T(CX[c] + CWD / 2 + nw / 2 + 10, ny + 30, 20, "× " + (FAC[c] === 1 ? "1" : FAC[c].toFixed(2)), YEL, fo, "start");
    }
    s += T(950, L + ROW2 + 42, 20, "each chunk computed where it is, into a small note", GRN, ease(prog(t, T0 + 0.6, 0.4)) * (1 - clamp(mg / 0.35)), "start");
    if (mg > 0.4) s += T(950, L + ROW2 + 42, 20, "notes merged exactly: the same answer as one softmax", GRN, (mg - 0.4) / 0.6, "start");
    var na = ease(prog(t, tNewEnd - 0.2, 0.4));
    s += R(ANS, L + MEM, AW, MH, 12, "rgba(63,191,63," + (.04 + .12 * na) + ")", na > 0 ? GRN : GRY, 2, ' opacity="' + fin + '"');
    s += T(ANS + AW / 2, L + MEM + 34, 22, "answer", na > 0 ? "#fff" : GRY, fin, "middle");
    if (na > 0) s += T(ANS + AW / 2, L + MEM + MH + 26, 18, "error vs fp32 0.011", GRN, na, "middle");
    var grown = Math.min((t - T0) * RATE, NEW_ALL);
    var nwid = grown - (NEW_ALL - NEW_PAIR) * pair;
    var nlab = grown >= NEW_ALL ? (pair > 0.5 ? "4.08 s: two chunks per call" : "4.34 s per video") : null;
    s += timebar(L, nwid, [[NEW_ALL, "rgba(63,191,63,.6)", "computing"]], nlab, GRN, fin);

    s += T(1580, 552, 16, "measured on 8 trn3 chips, LingBot-World v2, 81 frames 480x768", GRY, fin, "end");
    document.getElementById('dyn').innerHTML = s;
  }

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0 = performance.now(), running = false;
  function restart(){ t0 = performance.now(); if (!running){ running = true; requestAnimationFrame(tick); } }
  var hm = /t=([\d.]+)/.exec(location.hash);          // e.g. #t=3 freezes at 3 s (for checking)
  if (hm){ render(parseFloat(hm[1])); return; }
  if (reduce){ render(END - 0.01); return; }
  function tick(now){
    var t = (now - t0) / 1000;
    if (t >= END){ render(END - 0.01); running = false; return; }
    render(t); requestAnimationFrame(tick);
  }
  running = true; requestAnimationFrame(tick);
  document.addEventListener('click', restart);
  document.addEventListener('keydown', function(ev){ if (ev.code === 'Space'){ ev.preventDefault(); restart(); } });
})();
</script>
</body>
</html>
