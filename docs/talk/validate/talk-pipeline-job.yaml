# Talk deck numbers re-measured on LingBot-World v2 only (docs/talk/validate/README.md). 8 trn3 chips, xl-lnc2.
# e2e latency push (kiro/e2e/LEDGER.md): one Job = kiro/k8s_sweep.sh over LAYOUTS in one pod.
# Generate per experiment with scripts/k8s_mkjob.py (name, node pin, env); claim xl-lnc2 = 8 devices,
# l-lnc2 = 4 devices (sed). Outputs persist on the node: /opt/lingbot-world-v2/e2e/<job name>/.
apiVersion: batch/v1
kind: Job
metadata:
  name: lbw-talk-pipeline
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 100800
  template:
    metadata:
      labels:
        app: lbw-talk-pipeline
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ip-192-168-192-229.us-east-2.compute.internal
        node-type: trn3-dev1
      resourceClaims:
        - name: neuroncores
          resourceClaimTemplateName: xl-lnc2
      containers:
        - name: inference
          image: public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04
          command:
            - /bin/bash
            - "-c"
            - |
              set -euo pipefail
              git clone -b "$BRANCH" https://github.com/yahavb/lingbot-world-v2.git /tmp/lingbot
              cd /tmp/lingbot
              echo "commit: $(git log --oneline -1)"
              NODE=/node-cache; mkdir -p "$NODE"
              OUT=$NODE/e2e/$JOB_TAG; mkdir -p "$OUT"
              trap 'echo "results: node:/opt/lingbot-world-v2/e2e/$JOB_TAG"; sleep "$KEEP_ALIVE_SECONDS"' EXIT
              export CKPT=$NODE/lingbot-world-v2-14b-causal-fast
              export NEURON_COMPILE_CACHE_URL=$NODE/neuron-compile-cache
              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              export NKI_ENABLE_TRACE_CACHE=1
              export TORCH_NEURONX_HLO_CACHE_DIR=/var/tmp/hlo_cache
              export HF_HOME=/tmp/hf-cache

              pip install -q -r requirements_neuron.txt huggingface_hub
              python3 -c "import torchvision" 2>/dev/null || bash install_neuron.sh
              python3 -c "import torch, torch_neuronx; print('torch', torch.__version__, 'torch_neuronx', torch_neuronx.__version__)"
              pip list 2>/dev/null | grep -iE "^(nki|neuronx-cc|torch-neuronx|torch) " || true

              # checkpoint: download + convert once per node (flock; .complete marks a finished entry)
              flock "$NODE/ckpt.lock" bash -c '
                [ -f "$1/.complete" ] && { echo "ckpt: on node cache"; exit 0; }
                hf download robbyant/lingbot-world-v2-14b-causal-fast --local-dir "$1"
                [ -f "$1/transformers/config.json" ] || cp "$1/config.json" "$1/transformers/config.json"
                python3 scripts/inference/convert_dit_to_pth.py --ckpt_dir "$1"
                rm -f "$1"/transformers/*.safetensors
                touch "$1/.complete"' _ "$CKPT"

              python3 scripts/analysis/qk_gamma_temperature.py --ckpt_dir "$CKPT" | tee /tmp/qk.txt
              export FLASH_ATTN_LAYERS=$(grep -oE "CANDIDATE HOT LAYERS \([0-9]+\): [0-9,]+" /tmp/qk.txt | sed -E "s/.*: //" || true)
              echo "FLASH_ATTN_LAYERS=$FLASH_ATTN_LAYERS"

              neuron-ls 2>/dev/null | head -20 || true
              if [ -n "${PAIRS_MANIFEST:-}" ]; then   # device-profile capture only (kiro/e2e/pairs.sh)
                bash kiro/e2e/pairs.sh "$NODE/e2e/$PAIRS_MANIFEST" "$NODE/e2e/$PAIRS_NEFFS" "$OUT/pairs" "$NPROC" 2>&1 | tee "$OUT/pairs.txt"
                exit 0
              fi
              OUT=$OUT bash kiro/k8s_sweep.sh 2>&1 | tee "$OUT/sweep.txt"
              ( export NEURON_LOGICAL_NC_CONFIG=2; d=$OUT/vae_1rank_eager; mkdir -p $d
                for i in 1 2; do torchrun --nproc_per_node=1 --master_port=29745 decode_latents_width_sharded.py --task i2v-A14B --ckpt_dir $CKPT --latents_path $OUT/lnc2_4x8_eager/latents.pt --save_file $d/out.mp4 --timing --warmup > $d/dec$i.log 2>&1; echo "1rank dec$i exit=$?"; done
                grep -hE "steady-state|Error" $d/dec*.log | tail -4 ) || true
              echo "SWEEP COMPLETE"
          resources:
            claims:
              - name: neuroncores
            requests:
              ephemeral-storage: 600Gi
            limits:
              ephemeral-storage: 600Gi
          volumeMounts:
            - name: node-cache
              mountPath: /node-cache
            - name: dshm
              mountPath: /dev/shm
          env:
            - name: PROFILE_CFG
              value: "4x8_compile"
            - name: CFG_lnc2_4x8_eager
              value: "LINGBOT_COMPILE_DIT=0 ATTENTION_BACKEND=sdpa LINGBOT_SP=0 LINGBOT_CTE_MERGE=0 LINGBOT_FILM_A2A=0 LINGBOT_SKIP_LAST_COMMIT=0 LINGBOT_NO_SYNC=0 LINGBOT_TOKEN_PAD=128 LINGBOT_ATTN_EARLY=0 LINGBOT_ATTN_PAIR=0 LINGBOT_PLUCKER_COMPILE=0 LINGBOT_FILM_BATCH=0 LINGBOT_HEAD_COMPILE=0 LINGBOT_CROSS_NMAJOR=0 LINGBOT_PREUPLOAD=0 LINGBOT_EMPTY_CACHE_SEQ=4096 LINGBOT_COMMIT_NOHEAD=0 LINGBOT_VAE_FUSED=0 LINGBOT_VAE_BF16=0 LINGBOT_VAE_CC_FLAGS= LINGBOT_VAE_NORM=normalize LINGBOT_VAE_T=1 LINGBOT_VAE_2D=0 LINGBOT_FILM_ALL=0 LINGBOT_KEY_THREADS=0 LINGBOT_IMG_BLOCK=0 LINGBOT_CTE_LOCAL=0 LINGBOT_CTE_VGROUP=1 LINGBOT_K_BLOCKED=0 LINGBOT_STEP_NOWRITE=0 LINGBOT_BENCH_RUNS=2"
            - name: CFG_lnc2_4x8_eagercte
              value: "LINGBOT_COMPILE_DIT=0 ATTENTION_BACKEND=sdpa LINGBOT_SP=0 LINGBOT_CTE_MERGE=0 LINGBOT_FILM_A2A=0 LINGBOT_SKIP_LAST_COMMIT=0 LINGBOT_NO_SYNC=0 LINGBOT_TOKEN_PAD=128 LINGBOT_ATTN_EARLY=0 LINGBOT_ATTN_PAIR=0 LINGBOT_PLUCKER_COMPILE=0 LINGBOT_FILM_BATCH=0 LINGBOT_HEAD_COMPILE=0 LINGBOT_CROSS_NMAJOR=0 LINGBOT_PREUPLOAD=0 LINGBOT_EMPTY_CACHE_SEQ=4096 LINGBOT_COMMIT_NOHEAD=0 LINGBOT_VAE_FUSED=0 LINGBOT_VAE_BF16=0 LINGBOT_VAE_CC_FLAGS= LINGBOT_VAE_NORM=normalize LINGBOT_VAE_T=1 LINGBOT_VAE_2D=0 LINGBOT_FILM_ALL=0 LINGBOT_KEY_THREADS=0 LINGBOT_IMG_BLOCK=0 LINGBOT_CTE_LOCAL=0 LINGBOT_CTE_VGROUP=1 LINGBOT_K_BLOCKED=0 LINGBOT_STEP_NOWRITE=0 ATTENTION_BACKEND=cte LINGBOT_BENCH_RUNS=2"
            - name: CFG_lnc2_4x8_compile
              value: "LINGBOT_COMPILE_DIT=0 ATTENTION_BACKEND=sdpa LINGBOT_SP=0 LINGBOT_CTE_MERGE=0 LINGBOT_FILM_A2A=0 LINGBOT_SKIP_LAST_COMMIT=0 LINGBOT_NO_SYNC=0 LINGBOT_TOKEN_PAD=128 LINGBOT_ATTN_EARLY=0 LINGBOT_ATTN_PAIR=0 LINGBOT_PLUCKER_COMPILE=0 LINGBOT_FILM_BATCH=0 LINGBOT_HEAD_COMPILE=0 LINGBOT_CROSS_NMAJOR=0 LINGBOT_PREUPLOAD=0 LINGBOT_EMPTY_CACHE_SEQ=4096 LINGBOT_COMMIT_NOHEAD=0 LINGBOT_VAE_FUSED=0 LINGBOT_VAE_BF16=0 LINGBOT_VAE_CC_FLAGS= LINGBOT_VAE_NORM=normalize LINGBOT_VAE_T=1 LINGBOT_VAE_2D=0 LINGBOT_FILM_ALL=0 LINGBOT_KEY_THREADS=0 LINGBOT_IMG_BLOCK=0 LINGBOT_CTE_LOCAL=0 LINGBOT_CTE_VGROUP=1 LINGBOT_K_BLOCKED=0 LINGBOT_STEP_NOWRITE=0 LINGBOT_COMPILE_DIT=1"
            - name: CFG_lnc2_4x8_compilecte
              value: "LINGBOT_COMPILE_DIT=0 ATTENTION_BACKEND=sdpa LINGBOT_SP=0 LINGBOT_CTE_MERGE=0 LINGBOT_FILM_A2A=0 LINGBOT_SKIP_LAST_COMMIT=0 LINGBOT_NO_SYNC=0 LINGBOT_TOKEN_PAD=128 LINGBOT_ATTN_EARLY=0 LINGBOT_ATTN_PAIR=0 LINGBOT_PLUCKER_COMPILE=0 LINGBOT_FILM_BATCH=0 LINGBOT_HEAD_COMPILE=0 LINGBOT_CROSS_NMAJOR=0 LINGBOT_PREUPLOAD=0 LINGBOT_EMPTY_CACHE_SEQ=4096 LINGBOT_COMMIT_NOHEAD=0 LINGBOT_VAE_FUSED=0 LINGBOT_VAE_BF16=0 LINGBOT_VAE_CC_FLAGS= LINGBOT_VAE_NORM=normalize LINGBOT_VAE_T=1 LINGBOT_VAE_2D=0 LINGBOT_FILM_ALL=0 LINGBOT_KEY_THREADS=0 LINGBOT_IMG_BLOCK=0 LINGBOT_CTE_LOCAL=0 LINGBOT_CTE_VGROUP=1 LINGBOT_K_BLOCKED=0 LINGBOT_STEP_NOWRITE=0 LINGBOT_COMPILE_DIT=1 ATTENTION_BACKEND=cte"
            - name: CFG_lnc2_4x8_final
              value: "LINGBOT_WT_PRE=1 LINGBOT_ATTN_FMAJ=1 LINGBOT_FFN_FMAJ=1 LINGBOT_VAE_GATHER1=1 LINGBOT_FILM_ALL=0 LINGBOT_FILM_ALL_CHUNKS=3 LINGBOT_FILM_ALL_BLOCKS=10 LINGBOT_BLOCK_GROUP=2 LINGBOT_CTE_SCALAR_ROWMAX=1 LINGBOT_CTE_PRIOR_FULL=1 LINGBOT_CTE_EXP_SPLIT=2 LINGBOT_T5_FP32=1"
            - name: VAE_CFGS
              value: "final:LINGBOT_VAE_FUSED=1 eager:LINGBOT_VAE_FUSED=0,LINGBOT_VAE_BF16=0,LINGBOT_VAE_CC_FLAGS=,LINGBOT_VAE_NORM=normalize,LINGBOT_VAE_T=1,LINGBOT_VAE_2D=0 fused_only:LINGBOT_VAE_FUSED=1,LINGBOT_VAE_BF16=0,LINGBOT_VAE_CC_FLAGS=,LINGBOT_VAE_NORM=normalize,LINGBOT_VAE_T=1,LINGBOT_VAE_2D=0"
            - name: BRANCH
              value: "main"
            - name: LNC
              value: "2"
            - name: JOB_TAG
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['job-name']"}}
            - name: LAYOUTS
              value: "4x8_eager 4x8_eagercte 4x8_compile 4x8_compilecte 4x8_q20 4x8_final"
            - name: REPEAT
              value: ""
            - name: BENCH_RUNS
              value: "3"
            - name: QUALITY
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: KEEP_ALIVE_SECONDS
              value: "600"
            - name: NPROC
              value: "32"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true
      volumes:
        - name: node-cache
          hostPath:
            path: /opt/lingbot-world-v2
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
