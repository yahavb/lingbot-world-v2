# Talk backups B6a/B6b/B6e/B6f/B7c on 8 trn3 chips (RESULTS.md, Backups). One job at a time.
# Talk S7a 18.64 / S9c 18.40 fps / B6d softmax check, re-measured on 8 trn3 chips (branch loop_engineering_8dev). RESULTS.md.
# LINGBOT_CTE_CHAIN=0, V_TOKEN_MAJOR=0 (needs CHAIN), CMAX off (only active with CHAIN, model_fast.py:1389): the chained-call kernel path asserts on trn3 (kernels/attention_cte_lb.py:767, is_trn3_b1).
# e2e latency push (docs/perf/e2e/LEDGER.md): one Job = perf/k8s_sweep.sh over LAYOUTS in one pod.
# Generate per experiment with scripts/k8s_mkjob.py (name, node pin, env); claim xl-lnc2 = 8 devices,
# l-lnc2 = 4 devices (sed). Outputs persist on the node: /opt/lingbot-world-v2/e2e/<job name>/.
apiVersion: batch/v1
kind: Job
metadata:
  name: lbw-talk-b6f-8dev
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 100800
  template:
    metadata:
      labels:
        app: lbw-talk-b6f-8dev
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ip-192-168-192-229.us-east-2.compute.internal
        node-type: trn3-dev1
      resourceClaims:
        - name: neuroncores
          resourceClaimTemplateName: xl-lnc2
      containers:
        - name: inference
          image: public.ecr.aws/neuron/torch-neuronx:2.14.0-neuronx-py314-sdk2.33.0-ubuntu26.04
          command:
            - /bin/bash
            - "-c"
            - |
              set -euo pipefail
              git clone -b "$BRANCH" https://github.com/yahavb/lingbot-world-v2.git /tmp/lingbot
              cd /tmp/lingbot
              echo "commit: $(git log --oneline -1)"
              # this branch predates the k8s harness: take perf/k8s_sweep.sh and perf/e2e from main
              git fetch -q origin main && git checkout origin/main -- perf/k8s_sweep.sh perf/e2e && echo "harness from main: $(git log --oneline -1 origin/main)"
              NODE=/node-cache; mkdir -p "$NODE"
              OUT=$NODE/e2e/$JOB_TAG; mkdir -p "$OUT"
              trap 'echo "results: node:/opt/lingbot-world-v2/e2e/$JOB_TAG"; sleep "$KEEP_ALIVE_SECONDS"' EXIT
              export CKPT=$NODE/lingbot-world-v2-14b-causal-fast
              export NEURON_COMPILE_CACHE_URL=$NODE/neuron-compile-cache
              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              export NKI_ENABLE_TRACE_CACHE=1
              export TORCH_NEURONX_HLO_CACHE_DIR=/var/tmp/hlo_cache
              export HF_HOME=/tmp/hf-cache

              pip install -q -r requirements_neuron.txt huggingface_hub
              python3 -c "import torchvision" 2>/dev/null || bash install_neuron.sh
              python3 -c "import torch, torch_neuronx; print('torch', torch.__version__, 'torch_neuronx', torch_neuronx.__version__)"
              pip list 2>/dev/null | grep -iE "^(nki|neuronx-cc|torch-neuronx|torch) " || true

              # checkpoint: download + convert once per node (flock; .complete marks a finished entry)
              flock "$NODE/ckpt.lock" bash -c '
                [ -f "$1/.complete" ] && { echo "ckpt: on node cache"; exit 0; }
                hf download robbyant/lingbot-world-v2-14b-causal-fast --local-dir "$1"
                [ -f "$1/transformers/config.json" ] || cp "$1/config.json" "$1/transformers/config.json"
                python3 scripts/inference/convert_dit_to_pth.py --ckpt_dir "$1"
                rm -f "$1"/transformers/*.safetensors
                touch "$1/.complete"' _ "$CKPT"

              python3 scripts/analysis/qk_gamma_temperature.py --ckpt_dir "$CKPT" | tee /tmp/qk.txt
              export FLASH_ATTN_LAYERS=$(grep -oE "CANDIDATE HOT LAYERS \([0-9]+\): [0-9,]+" /tmp/qk.txt | sed -E "s/.*: //" || true)
              echo "FLASH_ATTN_LAYERS=$FLASH_ATTN_LAYERS"

              neuron-ls 2>/dev/null | head -20 || true
              if [ -n "${PAIRS_MANIFEST:-}" ]; then   # device-profile capture only (perf/e2e/pairs.sh)
                bash perf/e2e/pairs.sh "$NODE/e2e/$PAIRS_MANIFEST" "$NODE/e2e/$PAIRS_NEFFS" "$OUT/pairs" "$NPROC" 2>&1 | tee "$OUT/pairs.txt"
                exit 0
              fi
              OUT=$OUT bash perf/k8s_sweep.sh 2>&1 | tee "$OUT/sweep.txt"
              echo "SWEEP COMPLETE"
          resources:
            claims:
              - name: neuroncores
            requests:
              ephemeral-storage: 600Gi
            limits:
              ephemeral-storage: 600Gi
          volumeMounts:
            - name: node-cache
              mountPath: /node-cache
            - name: dshm
              mountPath: /dev/shm
          env:
            - name: PROFILE_CFG
              value: "4x8_d8nochain"
            - name: CFG_lnc2_4x8_d8exact
              value: "LINGBOT_CTE_CHAIN=0 LINGBOT_CROSS_TPOUT=1 LINGBOT_CTE_QPAD=32 LINGBOT_V_TOKEN_MAJOR=1 LINGBOT_CTE_PRIOR_FULL=1 LINGBOT_CMAX=2 NEURON_RT_IO_RING_CACHE_SIZE=1024 LINGBOT_KV_REUSE=1 LINGBOT_START_OVERLAP=4 LINGBOT_FILM_SHARD=1 LINGBOT_SCHED_FUSE=1 LINGBOT_GC_OFF=1 LINGBOT_FILM_ALL=1 LINGBOT_FILM_GROUP=4 LINGBOT_VAE_T=4 LINGBOT_FILM_ROWS=640 LINGBOT_KV_COALESCE=1 LINGBOT_RS_BF16=1 LINGBOT_FILM_AR_BF16=1 LINGBOT_CROSS_DEDUP=128 LINGBOT_COMMIT_Q_FIRST=2 LINGBOT_COMMIT_FROM_GATHER=1 LINGBOT_POST_LEAN=1 LINGBOT_CMAX=0"
            - name: CFG_lnc2_4x8_d8nochain
              value: "LINGBOT_CTE_CHAIN=0 LINGBOT_CROSS_TPOUT=1 LINGBOT_CTE_QPAD=32 LINGBOT_V_TOKEN_MAJOR=0 LINGBOT_CTE_PRIOR_FULL=1 LINGBOT_CMAX=2 NEURON_RT_IO_RING_CACHE_SIZE=1024 LINGBOT_KV_REUSE=1 LINGBOT_START_OVERLAP=4 LINGBOT_FILM_SHARD=1 LINGBOT_SCHED_FUSE=1 LINGBOT_GC_OFF=1 LINGBOT_FILM_ALL=1 LINGBOT_FILM_GROUP=4 LINGBOT_VAE_T=4 LINGBOT_FILM_ROWS=640 LINGBOT_KV_COALESCE=1 LINGBOT_RS_BF16=1 LINGBOT_FILM_AR_BF16=1 LINGBOT_CROSS_DEDUP=128 LINGBOT_COMMIT_Q_FIRST=2 LINGBOT_COMMIT_FROM_GATHER=1 LINGBOT_POST_LEAN=1 LINGBOT_CMAX=0"
            - name: CFG_lnc2_4x8_d8nochain_rep
              value: "LINGBOT_CTE_CHAIN=0 LINGBOT_CROSS_TPOUT=1 LINGBOT_CTE_QPAD=32 LINGBOT_V_TOKEN_MAJOR=0 LINGBOT_CTE_PRIOR_FULL=1 LINGBOT_CMAX=2 NEURON_RT_IO_RING_CACHE_SIZE=1024 LINGBOT_KV_REUSE=1 LINGBOT_START_OVERLAP=4 LINGBOT_FILM_SHARD=1 LINGBOT_SCHED_FUSE=1 LINGBOT_GC_OFF=1 LINGBOT_FILM_ALL=1 LINGBOT_FILM_GROUP=4 LINGBOT_VAE_T=4 LINGBOT_FILM_ROWS=640 LINGBOT_KV_COALESCE=1 LINGBOT_RS_BF16=1 LINGBOT_FILM_AR_BF16=1 LINGBOT_CROSS_DEDUP=128 LINGBOT_COMMIT_Q_FIRST=2 LINGBOT_COMMIT_FROM_GATHER=1 LINGBOT_POST_LEAN=1 LINGBOT_CMAX=0"
            - name: CFG_lnc2_4x8_d8lean
              value: "LINGBOT_CTE_CHAIN=0 LINGBOT_CROSS_TPOUT=1 LINGBOT_CTE_QPAD=32 LINGBOT_V_TOKEN_MAJOR=1 LINGBOT_CTE_PRIOR_FULL=1 LINGBOT_CMAX=2 NEURON_RT_IO_RING_CACHE_SIZE=1024 LINGBOT_KV_REUSE=1 LINGBOT_START_OVERLAP=4 LINGBOT_FILM_SHARD=1 LINGBOT_SCHED_FUSE=1 LINGBOT_GC_OFF=1 LINGBOT_FILM_ALL=1 LINGBOT_FILM_GROUP=4 LINGBOT_VAE_T=4 LINGBOT_FILM_ROWS=640 LINGBOT_KV_COALESCE=1 LINGBOT_RS_BF16=1 LINGBOT_FILM_AR_BF16=1 LINGBOT_CROSS_DEDUP=128 LINGBOT_COMMIT_Q_FIRST=2 LINGBOT_COMMIT_FROM_GATHER=1 LINGBOT_POST_LEAN=1"
            - name: CFG_lnc2_4x8_d8guard
              value: "LINGBOT_CTE_CHAIN=0 LINGBOT_CROSS_TPOUT=1 LINGBOT_CTE_QPAD=32 LINGBOT_V_TOKEN_MAJOR=1 LINGBOT_CTE_PRIOR_FULL=1 LINGBOT_CMAX=2 NEURON_RT_IO_RING_CACHE_SIZE=1024 LINGBOT_KV_REUSE=1 LINGBOT_START_OVERLAP=4 LINGBOT_FILM_SHARD=1 LINGBOT_SCHED_FUSE=1 LINGBOT_GC_OFF=1 LINGBOT_FILM_ALL=1 LINGBOT_FILM_GROUP=4 LINGBOT_VAE_T=4 LINGBOT_FILM_ROWS=640 LINGBOT_KV_COALESCE=1 LINGBOT_RS_BF16=1 LINGBOT_FILM_AR_BF16=1 LINGBOT_CROSS_DEDUP=128 LINGBOT_COMMIT_Q_FIRST=2 LINGBOT_COMMIT_FROM_GATHER=1 LINGBOT_POST_LEAN=1 LINGBOT_CMAX_GUARD=1"
            - name: CFG_lnc2_4x8_d8guard_rep
              value: "LINGBOT_CTE_CHAIN=0 LINGBOT_CROSS_TPOUT=1 LINGBOT_CTE_QPAD=32 LINGBOT_V_TOKEN_MAJOR=1 LINGBOT_CTE_PRIOR_FULL=1 LINGBOT_CMAX=2 NEURON_RT_IO_RING_CACHE_SIZE=1024 LINGBOT_KV_REUSE=1 LINGBOT_START_OVERLAP=4 LINGBOT_FILM_SHARD=1 LINGBOT_SCHED_FUSE=1 LINGBOT_GC_OFF=1 LINGBOT_FILM_ALL=1 LINGBOT_FILM_GROUP=4 LINGBOT_VAE_T=4 LINGBOT_FILM_ROWS=640 LINGBOT_KV_COALESCE=1 LINGBOT_RS_BF16=1 LINGBOT_FILM_AR_BF16=1 LINGBOT_CROSS_DEDUP=128 LINGBOT_COMMIT_Q_FIRST=2 LINGBOT_COMMIT_FROM_GATHER=1 LINGBOT_POST_LEAN=1 LINGBOT_CMAX_GUARD=1"
            - name: BRANCH
              value: "loop_engineering_8dev"
            - name: LNC
              value: "2"
            - name: JOB_TAG
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['job-name']"}}
            - name: LAYOUTS
              value: "4x8_d8nochain"
            - name: REPEAT
              value: ""
            - name: BENCH_RUNS
              value: "3"
            - name: QUALITY
              value: "0"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: KEEP_ALIVE_SECONDS
              value: "600"
            - name: NPROC
              value: "32"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true
      volumes:
        - name: node-cache
          hostPath:
            path: /opt/lingbot-world-v2
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
