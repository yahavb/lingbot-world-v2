<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LingBot-World v2 live on AWS Trainium</title>
<style>
  :root { --bg: #111; --fg: #f5f5f5; --muted: #bbb; --accent: #ffb000; --btn: #2a2a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.4 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  select, button, textarea { font: inherit; color: var(--fg); background: var(--btn);
    border: 2px solid #555; border-radius: 8px; padding: 10px 16px; }
  button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 4px solid var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); color: #000; border-color: var(--accent); }
  button.primary { background: #0a6; border-color: #0a6; }
  button.stop { background: #a22; border-color: #a22; }
  #view { position: relative; width: 100%; aspect-ratio: 768 / 480; background: #000; border-radius: 8px; overflow: hidden; }
  #frame { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* glass overlays on the video: blurred, see-through, small, monospace -- a camera HUD */
  .glass { background: rgba(10, 14, 20, .28); backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%); border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 8px; color: #e8f4ff; font: 600 13px/1.3 ui-monospace, monospace; letter-spacing: .04em; }
  #hud { position: absolute; top: 10px; left: 10px; padding: 6px 10px; white-space: pre; pointer-events: none; }
  .overlay { position: absolute; pointer-events: none; }
  .overlay button { pointer-events: auto; }
  button.hudbtn { padding: 0; width: 34px; height: 34px; font: 600 14px/1 ui-monospace, monospace;
    text-transform: uppercase; display: grid; place-items: center; }
  button.hudbtn.wide { width: auto; padding: 0 10px; }
  button.hudbtn:hover { background: rgba(255, 255, 255, .16); }
  button.hudbtn[aria-pressed="true"] { background: rgba(0, 200, 255, .30); border-color: rgba(120, 230, 255, .9);
    color: #fff; box-shadow: 0 0 10px rgba(0, 200, 255, .55); }
  #controls { left: 10px; bottom: 10px; display: flex; gap: 8px; align-items: end; }
  .pad { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); gap: 4px; }
  .side { display: grid; gap: 4px; }
  /* Muse Glimmer as a rolling terminal in the top-right quarter: newest line at the bottom, older ones
     scroll up and fade out at the top */
  #muse { right: 10px; top: 10px; width: 42%; height: 25%; padding: 6px 10px; display: flex;
    flex-direction: column; justify-content: flex-end; overflow: hidden;
    background: rgba(5, 10, 16, .42); text-shadow: 0 0 4px rgba(0, 0, 0, .9);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%); mask-image: linear-gradient(to bottom, transparent 0, #000 22%); }
  #muse .ln { color: #f2f8ff; }
  #muse .ln { margin: 2px 0; white-space: pre-wrap; animation: rise .35s ease-out; }
  #muse .ts { color: #7fd4ff; }
  #muse .pr { color: #6fff9c; }
  #muse .cur::after { content: "\2588"; animation: blink 1s steps(1) infinite; color: #6fff9c; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  #status { color: var(--muted); min-height: 1.5em; }
  textarea { width: 100%; }
  kbd { background: #333; border-radius: 4px; padding: 0 6px; }
</style>
</head>
<body>
<main>
  <h1>LingBot-World v2 live on AWS Trainium</h1>

  <div class="row">
    <label for="scene">Scene</label>
    <select id="scene"></select>
    <button id="start" class="primary">Start</button>
    <button id="stopBtn" class="stop" disabled>Stop</button>
  </div>

  <div id="view">
    <img id="frame" alt="Live generated video">
    <div id="hud" class="glass" aria-hidden="true"></div>
    <div id="muse" class="overlay glass" role="log" aria-live="polite" aria-label="Muse Glimmer"></div>
    <div id="controls" class="overlay" role="group" aria-label="Camera controls">
      <div class="pad">
        <span></span><button class="glass hudbtn" data-action="forward" aria-label="Forward">&#9650;</button><span></span>
        <button class="glass hudbtn" data-action="left" aria-label="Left">&#9664;</button><button class="glass hudbtn" data-action="stop" aria-label="Hold">&#9632;</button><button class="glass hudbtn" data-action="right" aria-label="Right">&#9654;</button>
        <span></span><button class="glass hudbtn" data-action="back" aria-label="Back">&#9660;</button><span></span>
      </div>
      <div class="side">
        <button class="glass hudbtn wide" data-action="up" aria-label="Up">Up</button>
        <button class="glass hudbtn wide" data-action="down" aria-label="Down">Dn</button>
        <button class="glass hudbtn wide" data-action="auto" aria-label="Scene path" aria-pressed="true">Path</button>
      </div>
    </div>
  </div>

  <p id="status" role="status" aria-live="polite">Pick a scene and press Start.</p>
  <p>Keys: <kbd>W</kbd>/<kbd>↑</kbd> forward, <kbd>S</kbd>/<kbd>↓</kbd> back, <kbd>A</kbd>/<kbd>←</kbd> left,
    <kbd>D</kbd>/<kbd>→</kbd> right, <kbd>R</kbd> up, <kbd>F</kbd> down, <kbd>Space</kbd> hold, <kbd>P</kbd> scene path.</p>

</main>
<script>
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), hud = $("hud"), img = $("frame");
const KEYS = { w: "forward", arrowup: "forward", s: "back", arrowdown: "back", a: "left",
  arrowleft: "left", d: "right", arrowright: "right", r: "up", f: "down", " ": "stop", p: "auto" };
let scenes = [], abort = null, buffer = [], arrivals = [], shown = [], lastChunk = -1;
// Frames to hold before and during playback (2 chunks of 12; 24 tested smoothest); ?buf=N overrides it.
const BUF_TARGET = Number(new URLSearchParams(location.search).get("buf")) || 24;
let playing = false, nextAt = 0, playFps = 16, pressed = null, latencyMs = null, total = 0;
let offsetMs = 0, breakdown = "";  // server clock - local clock (ms), from /control round trips

function say(msg) { statusEl.textContent = msg; }

async function loadScenes() {
  scenes = await (await fetch("api/scenes")).json();
  for (const s of scenes) $("scene").add(new Option(s.name, s.id));
  pickScene();
}
function pickScene() {
  const s = scenes.find((x) => x.id === $("scene").value);
  img.src = `api/scenes/${s.id}/image.jpg`;
}

function setPressed(action) {
  for (const b of document.querySelectorAll("[data-action]"))
    b.setAttribute("aria-pressed", String(b.dataset.action === action));
}

async function control(body) {
  const t0 = Date.now();
  const r = await fetch("api/control", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) });
  if (r.ok) {
    const j = await r.json(), t1 = Date.now();
    if (j.t) offsetMs = j.t * 1000 - (t0 + t1) / 2;
  }
  return r.ok;
}

async function act(action) {
  setPressed(action);
  pressed = { action, t: performance.now(), after: lastChunk };
  latencyMs = null;
  if (abort) await control({ action });
  say(action === "auto" ? "Following the scene path." : action === "stop" ? "Holding still." : `Moving ${action}.`);
}

// Where the press-to-screen time went, from the server times on the first frame that shows it.
function timing(f, shownAt) {
  const t = f.t;
  if (!t || !t.start) return "";
  const local = (x) => (x * 1000 - offsetMs);                    // server s -> local epoch ms
  const pressEpoch = performance.timeOrigin + pressed.t, shownEpoch = performance.timeOrigin + shownAt;
  const arriveEpoch = performance.timeOrigin + f.arrived;
  const sec = (a, b) => ((b - a) / 1000).toFixed(2);
  return `wait ${sec(pressEpoch, local(t.start))}  dit ${sec(local(t.start), local(t.x0))}  ` +
    `vae ${sec(local(t.x0), local(t.dec))}  net ${sec(local(t.dec), arriveEpoch)}  buf ${sec(arriveEpoch, shownEpoch)}`;
}

// the serving setup, last line of the video HUD
const SETUP = "4x trn3-dev1   MXFP8   LNC2   480\u00d7768";
function fpsText() {
  const g = rate(arrivals, 6000), v = rate(shown, 3000);
  return g > 0 || v > 0 ? `fps: generated ${g.toFixed(1)}, shown ${v.toFixed(1)}, chunk ${lastChunk}`
                        : "fps: not streaming";
}

function rate(list, windowMs) {
  const now = performance.now();
  while (list.length && now - list[0] > windowMs) list.shift();
  return list.length > 1 ? (list.length - 1) * 1000 / (list[list.length - 1] - list[0]) : 0;
}

function tick(now) {
  if (playing && buffer.length && now >= nextAt) {
    const f = buffer.shift();
    img.src = "data:image/jpeg;base64," + f.frame;
    shown.push(now);
    if (pressed && latencyMs === null && f.action === pressed.action && f.chunk > pressed.after) {
      latencyMs = now - pressed.t;
      breakdown = timing(f, now);
    }
    // Play at the generation rate, about one chunk buffered. After a press, frames made before
    // it play 1.5x faster so the new motion comes on screen sooner.
    const gen = rate(arrivals, 6000);
    if (gen > 0) playFps = gen;
    const catchUp = pressed && latencyMs === null;
    // Keep about 1.5 chunks buffered (frames arrive 12 at a time): speed up or slow down in proportion to how
    // far the buffer is from that target, so a late chunk is absorbed instead of draining the buffer.
    const adj = catchUp ? 1.5 : Math.min(1.25, Math.max(0.75, 1 + (buffer.length - BUF_TARGET) / (2 * BUF_TARGET)));
    nextAt = Math.max(nextAt + 1000 / (playFps * adj), now - 50);
  }
  if (playing && !buffer.length && abort === null) playing = false;
  hud.textContent =
    `generated ${rate(arrivals, 6000).toFixed(1)} fps   shown ${rate(shown, 3000).toFixed(1)} fps\n` +
    `buffer ${buffer.length}   frames ${total}   chunk ${lastChunk}\n` +
    `control latency ${latencyMs === null ? "-" : (latencyMs / 1000).toFixed(2) + " s"}` +
    (breakdown ? `\n${breakdown}` : "") +
    `\n${SETUP}`;
  requestAnimationFrame(tick);
}

async function start() {
  await stop();
  const scene = $("scene").value;
  buffer = []; arrivals = []; shown = []; lastChunk = -1; total = 0; playing = false; latencyMs = null;
  const ctl = new AbortController();
  abort = ctl;
  $("start").disabled = true; $("stopBtn").disabled = false;
  say("Starting. The first frames take a few seconds.");
  try {
    const r = await fetch("api/session", { method: "POST", signal: ctl.signal,
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ scene }) });
    if (!r.ok) { say(`Could not start: ${(await r.json()).detail || r.status}`); return; }
    const current = document.querySelector('[aria-pressed="true"]');
    if (current && current.dataset.action !== "auto") control({ action: current.dataset.action });
    const reader = r.body.getReader(), dec = new TextDecoder();
    let text = "", first = true;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      text += dec.decode(value, { stream: true });
      let i;
      while ((i = text.indexOf("\n\n")) >= 0) {
        const line = text.slice(0, i); text = text.slice(i + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.frame) {
          ev.arrived = performance.now();
          buffer.push(ev); arrivals.push(ev.arrived); total++;
          if (ev.chunk > lastChunk) lastChunk = ev.chunk;
          if (first) { first = false; say("Streaming. Use the arrows or W A S D to steer."); }
          if (!playing && buffer.length >= BUF_TARGET) { playing = true; nextAt = performance.now(); }
        } else if (ev.error) say(`Error: ${ev.error}`);
        else if (ev.superseded) say(`Stopped: ${ev.superseded}`);
        else if (ev.done) say(`Session ended: ${ev.frames} frames in ${ev.seconds} s.`);
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") say(`Stream error: ${e.message}`);
  } finally {
    if (abort === ctl) { abort = null; playing = buffer.length > 0; }
    $("start").disabled = false; $("stopBtn").disabled = true;
  }
}

async function stop() {
  if (!abort) return;
  const a = abort; abort = null;
  a.abort();
  await fetch("api/stop", { method: "POST" }).catch(() => {});
  say("Stopped.");
}

for (const b of document.querySelectorAll("[data-action]")) b.addEventListener("click", () => act(b.dataset.action));
$("scene").addEventListener("change", pickScene);
$("start").addEventListener("click", start);
$("stopBtn").addEventListener("click", stop);
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT" || e.repeat) return;
  if (e.key.toLowerCase() === "f") { e.preventDefault(); say(fpsText()); return; }
  const a = KEYS[e.key.toLowerCase()];
  if (a) { e.preventDefault(); act(a); }
});
window.addEventListener("pagehide", () => navigator.sendBeacon && navigator.sendBeacon("api/stop"));
// Content eval: Muse-Glimmer-30B describes the last ~3 s of the stream (/api/describe).
let describing = false;
const MUSE_LINES = 8;
function museLine(text) {
  // one terminal line: [hh:mm:ss] muse-glimmer$ text, typed out, newest at the bottom
  const box = $("muse"), ln = document.createElement("div");
  ln.className = "ln";
  const ts = document.createElement("span"); ts.className = "ts";
  ts.textContent = `[${new Date().toTimeString().slice(0, 8)}] `;
  const pr = document.createElement("span"); pr.className = "pr"; pr.textContent = "muse-glimmer$ ";
  const tx = document.createElement("span"); tx.className = "cur";
  ln.append(ts, pr, tx);
  for (const c of box.querySelectorAll(".cur")) c.classList.remove("cur");
  box.append(ln);
  while (box.children.length > MUSE_LINES) box.firstChild.remove();
  let i = 0;
  (function type() { tx.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(type, 18); })();
}
async function describe() {
  if (describing) return;
  describing = true;
  try {
    const r = await fetch("api/describe", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const j = await r.json();
    museLine(r.ok ? j.text : `error: ${j.detail || r.status}`);
  } catch (e) {
    museLine(`error: ${e.message}`);
  } finally { describing = false; }
}
// Every DESCRIBE_S seconds while frames are streaming, Muse Glimmer describes what is on screen; the caption
// floats on the video and stays until the next one (?describe=N sets the period, 0 turns it off).
const DESCRIBE_S = Number(new URLSearchParams(location.search).get("describe") ?? 15);
if (DESCRIBE_S > 0) setInterval(() => { if (abort && total > 0) describe(); }, DESCRIBE_S * 1000);
loadScenes();
requestAnimationFrame(tick);
</script>
</body>
</html>
