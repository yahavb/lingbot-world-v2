# Front end for lbw-deploy.yaml (Service in lbw-svc.yaml, ALB path in lbw-ing.yaml).
# Live, steerable front end (web_app.py + web/index.html) for lbw-v2. served at /lbw through the ALB (lbw-ing.yaml);
#   fallback: kubectl port-forward svc/lbw-web 7860:7860, then http://localhost:7860/lbw/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lbw-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lbw-web
  template:
    metadata:
      labels:
        app: lbw-web
    spec:
      # m5 nodes only: the ALB (target-type ip) serves us-east-2a/2c; trn nodes sit in a
      # local zone subnet (us-east-2-sbn-1a) it cannot reach (Target.NotInUse)
      nodeSelector:
        node-type: m5
      containers:
        - name: app
          image: public.ecr.aws/docker/library/python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DEBIAN_FRONTEND=noninteractive apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git >/dev/null
              git clone -b "$BRANCH" https://github.com/yahavb/lingbot-world-v2.git /app
              pip install -q --root-user-action=ignore --disable-pip-version-check fastapi uvicorn httpx imageio imageio-ffmpeg numpy pillow
              exec python -u /app/web_app.py
          env:
            - name: BRANCH
              value: "main"
            # in-pod bind; the Service is ClusterIP and nothing is published (kubectl port-forward)
            - name: HOST
              value: "0.0.0.0"
            - name: VLM_URL
              value: "http://muse-glimmer-30b-vllm.default.svc.cluster.local:8000/v1"
            - name: LBW_URL
              value: "http://lbw-v2.default.svc.cluster.local:8000"
            # served under /lbw (the dev1 ALB routes /lbw straight here, no path rewrite)
            - name: URL_PREFIX
              value: "/lbw"
          ports:
            - containerPort: 7860
          readinessProbe:
            httpGet:
              path: /lbw/
              port: 7860
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
